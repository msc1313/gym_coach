<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Тренер</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --lime:#D97845; --green:#E69A70; --olive:#A85A32; --on:#151719; --acc-rgb:217,120,69;
  --bg:#151719; --graphite:#393D41; --dark:#393D41; --mid:#6B7178;
  --inactive:#93999D; --text:#F2F0EC; --text2:#D8D5D0; --outline:#40464B;
  --card:#232629; --card2:#2B2F33; --line:#2B2F33; --done:#2A2420; --sheet:#1B1E21; --navbg:rgba(35,38,41,.92);
  --easy:#7FB77E; --norm:#E2B04A; --hard:#E5534B; --warm:#6B7178;
  --top:calc(var(--tg-safe-area-inset-top,0px) + var(--tg-content-safe-area-inset-top,0px));
  --bot:calc(var(--tg-safe-area-inset-bottom,0px) + var(--tg-content-safe-area-inset-bottom,0px));
  --ease:cubic-bezier(.2,.8,.2,1);
  color-scheme:dark;
}
/* светлая тема (графит × сиена) */
html.light{
  --lime:#D2703C; --green:#E69A70; --olive:#A85A32; --on:#FFFFFF; --acc-rgb:210,112,60;
  --bg:#F6F3F0; --graphite:#B8B0A9; --dark:#E4DDD7; --mid:#A39A93;
  --inactive:#857C76; --text:#24201D; --text2:#4A433F; --outline:#DDD5CE;
  --card:#EEE8E3; --card2:#E7E0D9; --line:#E2DAD3; --done:#F6E7DC; --sheet:#FBF9F7; --navbg:rgba(238,232,227,.94);
  --easy:#6FA86E; --norm:#D9A53A; --hard:#DC5148; --warm:#A39A93;
  color-scheme:light;
}
/* тёмная тема с розовым акцентом (женский профиль) */
html.fem{
  --lime:#D98F9D; --green:#F2C5B5; --olive:#C98877; --on:#1E1A1C; --acc-rgb:217,143,157; --done:#2A2224;
}
/* женская светлая тема: Soft Peach × Dusty Rose */
html.fem.light{
  --lime:#D98F9D; --green:#F2C5B5; --olive:#C98877; --on:#443A3D; --acc-rgb:217,143,157;
  --bg:#FAF7F5; --graphite:#B9A9A8; --dark:#E6D9D6; --mid:#B3A5A7;
  --inactive:#988A8D; --text:#443A3D; --text2:#5E5154; --outline:#DDCFCE;
  --card:#F3EAE7; --card2:#EEE2DE; --line:#EADCD8; --done:#F7E6E7; --sheet:#FCF8F6; --navbg:rgba(243,234,231,.94);
  --easy:#8DBF8B; --norm:#E7B65C; --hard:#E06A6A; --warm:#B3A5A7;
  color-scheme:light;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0}
html,body{background:var(--bg);color:var(--text);height:100%;overflow:hidden;
  font:15px/1.4 Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  -webkit-font-smoothing:antialiased;font-feature-settings:"tnum" 1,"cv11" 1}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;touch-action:manipulation}
input{font:inherit;color:inherit}
svg{display:block}

/* ---------- экраны ---------- */
.view{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;
  padding:calc(var(--top) + 16px) 16px calc(var(--bot) + 110px);
  transition:transform .38s var(--ease),opacity .38s var(--ease)}
html.light .scrim{background:rgba(68,58,61,.35)}
.view.off-right{transform:translateX(100%);opacity:.4;pointer-events:none}
.view.off-left{transform:translateX(-22%);opacity:0;pointer-events:none}
.view.hidden{display:none}

/* ---------- шапки ---------- */
.head{display:flex;align-items:flex-end;justify-content:space-between;margin:4px 2px 18px}
.eyebrow{font-size:12px;font-weight:600;color:var(--inactive);letter-spacing:.08em;text-transform:uppercase}
h1{font-size:30px;line-height:1.05;font-weight:800;letter-spacing:-.02em;margin-top:6px}
h2{font-size:20px;font-weight:700;letter-spacing:-.01em}
.sec{font-size:13px;font-weight:600;color:var(--inactive);letter-spacing:.06em;text-transform:uppercase;margin:26px 2px 10px}
.iconbtn{width:42px;height:42px;border-radius:14px;background:var(--card2);display:grid;place-items:center;flex:none}
.iconbtn svg{width:20px;height:20px}

/* ---------- календарь ---------- */
.cal{background:var(--card);border-radius:22px;padding:14px 12px 12px}
.calhead{display:flex;align-items:center;justify-content:space-between;margin:0 4px 12px}
.calhead b{font-size:15px;font-weight:600}
.calhead span{color:var(--inactive);font-size:13px}
.calnav{display:flex;gap:4px}
.calnav button{width:30px;height:30px;border-radius:10px;display:grid;place-items:center;color:var(--inactive)}
.calnav button:active{background:var(--dark)}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.wd{display:flex;flex-direction:column;align-items:center;gap:6px;padding:4px 0}
.wd small{font-size:11px;color:var(--mid);font-weight:600;text-transform:lowercase}
.wd .n{width:38px;height:46px;border-radius:14px;border:1px solid var(--dark);display:grid;place-items:center;
  font-weight:600;font-size:16px;position:relative;transition:all .2s}
.wd.today .n{border-color:var(--lime);color:var(--lime)}
.wd.done .n{background:var(--dark)}
.wd.done .n::after{content:"";position:absolute;bottom:6px;width:5px;height:5px;border-radius:50%;background:var(--lime)}
.wd.future .n{color:var(--mid)}
.wd.sel .n{background:var(--lime);color:var(--on);border-color:var(--lime)}
.wd.sel .n::after{background:var(--on)}
.calnote{font-size:13px;color:var(--inactive);text-align:center;margin-top:10px;min-height:18px}
.calnote b{color:var(--text);font-weight:600}
.dsess{background:var(--card2);border-radius:18px;padding:14px;margin-bottom:12px}
.dhead{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.dhead h3{flex:1}
.dtrash{width:36px;height:36px;border-radius:12px;display:grid;place-items:center;color:var(--mid);flex:none}
.dtrash:active{color:#E5484D;background:rgba(229,72,77,.12)}
.dconfirm{display:none;align-items:center;gap:8px;background:rgba(229,72,77,.1);border:1px solid rgba(229,72,77,.35);border-radius:12px;padding:8px 8px 8px 12px;margin-bottom:8px;font-size:14px}
.dconfirm span{flex:1;font-weight:600}
.dconfirm button{height:34px;padding:0 12px;border-radius:10px;font-weight:600;font-size:13px}
.dconfirm .dno{color:var(--inactive)}
.dconfirm .dyes{background:#E5484D;color:#fff}
.dsess.ask .dconfirm{display:flex}
.dex{padding:9px 0;border-top:1px solid var(--line)}
.dex b{font-size:14.5px;font-weight:600}
.dsets{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.dsets span{background:var(--card);border-radius:8px;padding:4px 8px;font-size:13px;font-weight:600;color:var(--text2)}
.donecard{display:flex;align-items:center;gap:12px;width:100%;background:var(--card);border-radius:20px;padding:14px 16px;margin-top:14px;text-align:left;font:inherit;color:inherit}
.donecard .dot{width:40px;height:40px;border-radius:12px;background:rgba(var(--acc-rgb),.16);display:grid;place-items:center;flex:none;color:var(--lime);font-size:20px;font-weight:800}
.donecard .t{flex:1}.donecard small{display:block;font-size:12px;color:var(--lime);font-weight:700;letter-spacing:.05em;text-transform:uppercase}
.donecard b{font-size:16px}
.dsess h3{font-size:16px;font-weight:700;margin:0;display:flex;align-items:center;gap:8px}
.dsess h3 span{font-size:11px;font-weight:600;color:var(--inactive);background:var(--card);border-radius:99px;padding:3px 8px}
.dsess ul{margin:0;padding-left:16px;font-size:14px;line-height:1.65}
.dsess ul span{color:var(--inactive)}
.cx-in{width:100%;background:var(--card2);border:1.5px solid transparent;border-radius:14px;padding:14px;color:var(--text);font:inherit;font-size:16px;outline:none}
.cx-in:focus{border-color:var(--lime)}
.cx-in::placeholder{color:var(--mid)}
.cx-opts{display:flex;flex-wrap:wrap;gap:8px}
.cx-opts button{height:38px;padding:0 14px;border-radius:99px;border:1.5px solid var(--outline);color:var(--inactive);font-size:14px;font-weight:600;display:flex;align-items:center;gap:6px}
.cx-opts button.on{border-color:var(--lime);color:var(--text);background:rgba(var(--acc-rgb),.12)}
.cx-opts button small{font-weight:500;color:var(--mid);font-size:12px}
.phead{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:4px 2px 18px}
.phead h1{font-size:30px;line-height:1.1;word-break:break-word}
.ava{width:60px;height:60px;border-radius:50%;background:rgba(var(--acc-rgb),.18);color:var(--lime);display:grid;place-items:center;font-size:24px;font-weight:800;flex:none;overflow:hidden}
.ava img{width:100%;height:100%;object-fit:cover}
.plist2{background:var(--card);border-radius:20px;overflow:hidden;margin-top:14px}
.prow2{display:flex;align-items:center;gap:12px;width:100%;padding:13px 14px;text-align:left;border-bottom:1px solid var(--line)}
.prow2:last-child{border:0}
.prow2 .pi{width:36px;height:36px;border-radius:11px;background:var(--card2);color:var(--lime);display:grid;place-items:center;flex:none}
.prow2 .pi svg{width:19px;height:19px}
.prow2 .pt{flex:1;min-width:0}.prow2 b{display:block;font-size:15px;font-weight:600}
.prow2 span{display:block;font-size:12.5px;color:var(--inactive);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prow2 .chev{color:var(--mid)}
.prow2.danger .pi,.prow2.danger b{color:#E5484D}
.seg{display:flex;flex-wrap:wrap;gap:8px}
.seg button{height:40px;padding:0 14px;border-radius:12px;border:1.5px solid var(--outline);color:var(--inactive);font-weight:600;font-size:14px}
.seg button.on{border-color:var(--lime);color:var(--text);background:rgba(var(--acc-rgb),.12)}
.hint{font-size:12.5px;color:var(--mid);text-align:center;margin:12px 0 0}
button.prow{width:100%;text-align:left;font:inherit;color:inherit}
.gift{background:var(--card);border-radius:20px;padding:14px}
.gift .prem{margin:0 0 12px}
.gift .btn2{margin:12px 0 0}
.promo{display:flex;gap:8px}
.promo input{flex:1;min-width:0;background:var(--card2);border:1.5px solid transparent;border-radius:14px;padding:13px 14px;color:var(--text);font:inherit;font-size:15px;outline:none;text-transform:uppercase}
.promo input::placeholder{text-transform:none;color:var(--mid)}
.promo input:focus{border-color:var(--lime)}
.promo button{background:var(--lime);color:var(--on);border-radius:14px;padding:0 16px;font-weight:700;font-size:14px}
.wedit{display:flex;align-items:center;gap:10px;margin-top:8px}
.wedit .val{flex:1}
.wdel{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;height:44px;margin-top:12px;border-radius:12px;border:1.5px solid rgba(229,72,77,.45);color:#E5484D;font-weight:600;font-size:14px}
.wdel.sure{background:#E5484D;color:#fff;border-color:#E5484D}

/* ---------- карточка «сегодня» ---------- */
.hero{background:var(--card);border-radius:26px;padding:18px;margin-top:14px;position:relative;overflow:hidden}
.hero .tag{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;color:var(--on);background:var(--lime);
  padding:5px 10px;border-radius:99px;letter-spacing:.02em}
.hero h2{font-size:24px;margin:12px 0 4px}
.hero .meta{color:var(--inactive);font-size:14px}
.bodies{display:flex;justify-content:center;gap:10px;margin:14px 0 4px}
.bodies svg{height:300px;width:auto}
.bodies.sm svg{height:220px}
.fig{display:flex;flex-direction:column;align-items:center;gap:8px}
.fig span{font-size:11px;color:var(--mid);font-weight:600;text-transform:uppercase;letter-spacing:.08em}
.bodies.sm .fig span{display:none}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.chip{display:inline-flex;align-items:center;gap:7px;height:34px;padding:0 14px 0 8px;border-radius:99px;
  border:1.5px solid var(--lime);font-size:13px;font-weight:600}
.chip i{width:18px;height:18px;border-radius:50%;background:var(--lime);display:grid;place-items:center}
.chip i svg{width:11px;height:11px}
.chip.sec2{border-color:var(--olive)}
.chip.sec2 i{background:var(--olive)}
.cta{width:100%;height:56px;border-radius:18px;background:var(--lime);color:var(--on);font-weight:800;font-size:17px;
  margin-top:18px;display:flex;align-items:center;justify-content:center;gap:10px;transition:transform .15s}
.cta:active{transform:scale(.98);background:var(--green)}
.cta.ghost{background:transparent;color:var(--lime);border:1.5px solid var(--lime)}

/* ---------- список дней ---------- */
.daylist{display:flex;flex-direction:column;gap:8px}
.dayrow{display:flex;align-items:center;gap:14px;background:var(--card);border-radius:18px;padding:14px;text-align:left;width:100%}
.dayrow:active{background:var(--card2)}
.dayrow .L{width:44px;height:44px;border-radius:14px;background:var(--dark);display:grid;place-items:center;font-weight:800;font-size:18px;flex:none}
.dayrow.next .L{background:var(--lime);color:var(--on)}
.dayrow .t{flex:1;min-width:0}
.dayrow .t b{display:block;font-weight:600}
.dayrow .t span{font-size:13px;color:var(--inactive);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chev{color:var(--mid);flex:none}

/* ---------- анкета ---------- */
#v-onb:not(.hidden){display:flex;flex-direction:column;padding-bottom:calc(var(--bot) + 24px)}
.onb-top{display:flex;align-items:center;gap:12px;margin-bottom:8px}
.dots{display:flex;gap:6px;flex:1;justify-content:center}
.dots i{width:22px;height:5px;border-radius:3px;background:var(--dark);transition:all .3s}
.dots i.on{background:var(--lime);width:34px}
.onb-step{flex:1;display:flex;flex-direction:column;justify-content:center;animation:fade .35s var(--ease)}
.onb-step h1{font-size:30px;text-align:center}
.onb-step p{color:var(--inactive);text-align:center;margin-top:8px;font-size:15px}
.bigval{text-align:center;margin:44px 0 18px;font-size:64px;font-weight:800;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.bigval small{font-size:20px;color:var(--inactive);font-weight:600;margin-left:6px}
.ruler{position:relative;height:84px;margin:0 -16px}
.ruler .track{height:100%;overflow-x:scroll;scrollbar-width:none;-webkit-overflow-scrolling:touch;scroll-snap-type:x mandatory}
.ruler .track::-webkit-scrollbar{display:none}
.ruler .ticks{display:flex;align-items:flex-start;height:100%}
.ruler .tk{flex:none;width:12px;height:100%;scroll-snap-align:center;position:relative}
.ruler .tk::before{content:"";position:absolute;left:50%;top:0;width:2px;height:22px;margin-left:-1px;border-radius:1px;background:var(--dark)}
.ruler .tk.mid::before{height:32px;background:var(--mid)}
.ruler .tk.big::before{height:44px;background:var(--inactive)}
.ruler .tk span{position:absolute;top:52px;left:50%;transform:translateX(-50%);font-size:12px;color:var(--mid);font-weight:600}
.ruler .needle{position:absolute;left:50%;top:-6px;width:4px;height:60px;margin-left:-2px;border-radius:2px;background:var(--lime);pointer-events:none;box-shadow:0 0 14px rgba(var(--acc-rgb),.6)}
.ruler::before,.ruler::after{content:"";position:absolute;top:0;bottom:0;width:70px;z-index:1;pointer-events:none}
.ruler::before{left:0;background:linear-gradient(90deg,var(--bg),transparent)}
.ruler::after{right:0;background:linear-gradient(-90deg,var(--bg),transparent)}
.fine{display:flex;justify-content:center;gap:12px;margin-top:14px}
.fine button{width:52px;height:44px;border-radius:14px;background:var(--card);font-size:22px;color:var(--lime);font-weight:600}
.choices{display:flex;flex-direction:column;gap:10px;margin-top:28px}
.choices button{display:flex;flex-direction:column;align-items:flex-start;gap:2px;padding:16px 18px;border-radius:18px;border:1.5px solid var(--outline);background:var(--card);text-align:left;transition:all .2s}
.choices button b{font-size:17px;font-weight:700}
.choices button span{font-size:13.5px;color:var(--inactive)}
.choices button.on{border-color:var(--lime);background:rgba(var(--acc-rgb),.12)}
.sexes{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:40px}
.sexes button{height:120px;border-radius:24px;border:1.5px solid var(--outline);background:var(--card);font-size:18px;font-weight:700;color:var(--inactive);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;transition:all .25s}
.sexes button svg{width:36px;height:36px}
.sexes button.on{border-color:var(--lime);color:var(--text);box-shadow:0 0 22px rgba(var(--acc-rgb),.18)}
.datebox{margin:40px auto 0;display:block;width:100%;max-width:320px;height:64px;border-radius:20px;border:1.5px solid var(--outline);background:var(--card);
  color:var(--text);font-size:22px;font-weight:700;text-align:center;padding:0 16px;-webkit-appearance:none;appearance:none}
.datebox::-webkit-date-and-time-value{text-align:center}
.agehint{text-align:center;color:var(--lime);font-weight:600;margin-top:14px;min-height:22px}

/* ---------- спросить тренера ---------- */
.ask{background:var(--card);border-radius:22px;padding:16px;margin-top:14px;position:relative;overflow:hidden}
.askhead{display:flex;align-items:center;justify-content:space-between;margin:-4px -4px 0 0}
.askopen{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;color:var(--inactive);background:var(--card2)}
.askcover{position:absolute;inset:0;z-index:2;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:18px 22px;text-align:center;
  background:linear-gradient(135deg,rgba(var(--acc-rgb),.22),rgba(var(--acc-rgb),.06) 60%),var(--card);border-radius:22px;
  transition:opacity .45s var(--ease),transform .45s var(--ease),filter .45s}
.askcover .cv-ic{width:48px;height:48px;border-radius:16px;background:rgba(var(--acc-rgb),.18);display:grid;place-items:center;animation:twinkle 2.4s ease-in-out infinite}
.askcover b{font-size:16.5px;line-height:1.35;font-weight:700;max-width:300px}
.askcover span{font-size:12.5px;color:var(--lime);font-weight:700;letter-spacing:.04em;text-transform:uppercase}
.askcover.gone{opacity:0;transform:scale(1.06);filter:blur(6px);pointer-events:none}
@keyframes twinkle{0%,100%{transform:scale(1) rotate(0)}50%{transform:scale(1.12) rotate(12deg)}}
/* ---------- обучение при первом входе ---------- */
.tour{position:fixed;inset:0;z-index:70;display:none}
.tour.show{display:block}
.tspot{position:absolute;border-radius:20px;box-shadow:0 0 0 9999px rgba(0,0,0,.72);transition:all .35s var(--ease);pointer-events:none}
.tcard{position:absolute;left:16px;right:16px;background:var(--sheet);border-radius:20px;padding:16px;box-shadow:0 12px 40px rgba(0,0,0,.35);transition:top .35s var(--ease);animation:fade .3s var(--ease)}
.tcard small{font-size:12px;font-weight:700;color:var(--lime);letter-spacing:.05em;text-transform:uppercase}
.tcard b{display:block;font-size:18px;margin:4px 0 6px}
.tcard p{font-size:14.5px;line-height:1.5;color:var(--text2);margin:0}
.tcard .tbtns{display:flex;justify-content:space-between;align-items:center;margin-top:14px}
.tcard .tskip{color:var(--inactive);font-weight:600;font-size:14px}
.tcard .tnext{height:42px;padding:0 20px;border-radius:13px;background:var(--lime);color:var(--on);font-weight:700}
/* ---------- чат с тренером ---------- */
#v-chat{padding-bottom:calc(var(--bot) + 96px)}
.ctop{position:sticky;top:calc(-1 * var(--top) - 16px);margin:calc(-1 * var(--top) - 16px) -16px 8px;padding:calc(var(--top) + 12px) 16px 12px;display:flex;align-items:center;gap:12px;background:var(--bg);z-index:3;border-bottom:1px solid var(--line)}
.ctop .t b{display:block;font-size:17px}.ctop .t span{font-size:12.5px;color:var(--inactive)}
.cava{width:40px;height:40px;border-radius:14px;background:rgba(var(--acc-rgb),.16);display:grid;place-items:center;flex:none}
.cmsgs{display:flex;flex-direction:column;gap:10px;padding-top:6px}
.bub{max-width:84%;padding:11px 14px;border-radius:18px;font-size:15px;line-height:1.48;white-space:pre-wrap;word-wrap:break-word;animation:fade .3s var(--ease)}
.bub.me{align-self:flex-end;background:var(--lime);color:var(--on);border-bottom-right-radius:6px}
.bub.ai{align-self:flex-start;background:var(--card);border-bottom-left-radius:6px}
.bub.ai .note{display:block;margin-top:8px;padding-top:8px;border-top:1px solid var(--line);color:var(--lime);font-size:13px;font-weight:600}
.bub.plan{width:84%;white-space:normal}
.bub.plan h4{font-size:16px;margin:2px 0 4px}.bub.plan p{font-size:13.5px;color:var(--inactive);margin:0 0 8px}
.bub.plan ol{margin:0 0 10px;padding-left:18px;font-size:14px;line-height:1.6}.bub.plan ol span{color:var(--inactive)}
.bub.plan .cta{height:44px;font-size:15px}
.bub .act{margin-top:10px;height:40px;width:100%;border-radius:12px;background:var(--lime);color:var(--on);font-weight:700}
.chello{text-align:center;color:var(--inactive);font-size:14px;line-height:1.5;padding:18px 12px 4px}
.chello b{display:block;color:var(--text);font-size:18px;margin-bottom:6px}
.cchips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;padding:6px 0 4px}
.cchips button{height:36px;padding:0 14px;border-radius:99px;border:1.5px solid var(--outline);color:var(--text2);font-size:13.5px;font-weight:600}
.cbar{position:fixed;left:0;right:0;bottom:0;z-index:25;display:flex;gap:8px;align-items:flex-end;padding:10px 12px calc(var(--bot) + 10px);background:var(--bg);border-top:1px solid var(--line);
  transform:translateY(110%);transition:transform .35s var(--ease)}
.cbar.show{transform:none}
.cbar textarea{flex:1;min-height:46px;max-height:130px;resize:none;background:var(--card2);border:1.5px solid transparent;border-radius:16px;padding:12px 14px;color:var(--text);font:inherit;font-size:15px;outline:none}
.cbar textarea:focus{border-color:var(--lime)}
.cbar .send{width:46px;height:46px;border-radius:16px;background:var(--lime);display:grid;place-items:center;flex:none}
.cbar .send:disabled{opacity:.5}
.cbar .clip{width:40px;height:46px;display:grid;place-items:center;color:var(--inactive);flex:none}
.ask small{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--lime);font-weight:700;letter-spacing:.05em;text-transform:uppercase}
.ask .row{display:flex;gap:8px;margin-top:12px}
.ask textarea{flex:1;min-height:48px;max-height:120px;resize:none;background:var(--card2);border:1.5px solid transparent;border-radius:16px;padding:13px 14px;
  color:var(--text);font:inherit;font-size:15px;outline:none;transition:border-color .2s}
.ask textarea:focus{border-color:var(--lime)}
.ask textarea::placeholder{color:var(--mid)}
.ask .send{width:48px;height:48px;border-radius:16px;background:var(--lime);display:grid;place-items:center;flex:none;align-self:flex-end}
.ask .send:active{background:var(--green)}
.ans{margin-top:12px;background:var(--card2);border-radius:16px;padding:13px 14px;font-size:14.5px;line-height:1.5;white-space:pre-wrap;animation:fade .3s var(--ease)}
.ans.q{background:transparent;padding:0 2px;color:var(--inactive);font-size:13px;margin-top:12px}
.thinking{display:flex;align-items:center;gap:10px;color:var(--inactive);font-size:14px}
.thinking i{width:7px;height:7px;border-radius:50%;background:var(--lime);display:inline-block;animation:blink 1.2s infinite}
.thinking i:nth-child(2){animation-delay:.2s}.thinking i:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,80%,100%{opacity:.25;transform:scale(.8)}40%{opacity:1;transform:scale(1)}}
.ask .send:disabled{opacity:.5}
.ask .clip{width:40px;height:48px;border-radius:14px;display:grid;place-items:center;color:var(--inactive);flex:none;align-self:flex-end;margin-right:-4px}
.ask .clip:active{color:var(--lime)}
.ans .note{display:block;margin-top:10px;padding-top:10px;border-top:1px solid var(--line);color:var(--lime);font-size:13px;font-weight:600}
.fbtext{white-space:pre-wrap;font-size:15px;line-height:1.55;margin:4px 0 18px}
.imp{background:var(--card2);border-radius:16px;padding:12px 14px;margin-bottom:10px;display:flex;gap:12px;align-items:flex-start}
.imp input[type=checkbox]{width:22px;height:22px;accent-color:var(--lime);flex:none;margin-top:1px}
.imp b{font-size:15px}.imp .dt{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.imp input[type=date]{background:var(--card);color:var(--text);border:1px solid var(--outline);border-radius:10px;padding:4px 8px;font:inherit;font-size:14px}
.imp ul{margin:0;padding-left:16px;font-size:13.5px;line-height:1.6;color:var(--text2)}
.imp ul span{color:var(--inactive)}
.imp .dup{font-size:12px;color:var(--inactive);font-weight:600}
.imp-unk{font-size:12.5px;color:var(--inactive);margin:-2px 0 12px}
.notes{background:var(--card);border-radius:18px;padding:6px 14px;margin:4px 0 12px}
.notes .nrow{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);font-size:14px}
.notes .nrow:last-child{border-bottom:0}
.notes .nrow span{flex:1}
.notes .nrow button{color:var(--inactive);font-size:18px;width:28px;height:28px;flex:none}
.notes .nadd{display:flex;gap:8px;padding:10px 0}
.notes .nadd input{flex:1;background:var(--card2);border:0;border-radius:12px;padding:10px 12px;color:var(--text);font:inherit;font-size:14px;outline:none}
.notes .nadd button{background:var(--lime);color:var(--on);border-radius:12px;padding:0 14px;font-weight:700}
.prem{background:rgba(var(--acc-rgb),.14);border:1.5px solid rgba(var(--acc-rgb),.45);border-radius:14px;padding:12px 14px;font-weight:700;font-size:15px;margin:0 0 10px;text-align:center}
.btn2{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;height:48px;border-radius:16px;border:1.5px solid var(--outline);color:var(--text);font-weight:600;font-size:15px;margin:6px 0 14px}
.btn2:active{border-color:var(--lime)}
.qchips{display:flex;gap:8px;overflow-x:auto;margin:12px -16px 0;padding:0 16px;scrollbar-width:none}
.qchips::-webkit-scrollbar{display:none}
.qchips button{flex:none;height:34px;padding:0 14px;border-radius:99px;border:1.5px solid var(--outline);color:var(--inactive);font-size:13px;font-weight:600}
.qchips button:active{border-color:var(--lime);color:var(--text)}
.profile{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;background:var(--card);border-radius:20px;padding:14px;margin-top:10px}
.profile div{text-align:center}
.profile b{display:block;font-size:20px;font-weight:800}
.profile span{font-size:12px;color:var(--inactive)}

/* ---------- пустой дневник ---------- */
.empty-hero{text-align:center;padding:10px 6px 0}
.illus{display:flex;justify-content:center;margin:18px 0 6px}
.illus svg{width:230px;height:auto}
.empty-hero h2{font-size:22px;margin-top:6px}
.empty-hero p{color:var(--inactive);font-size:14px;margin:8px auto 0;max-width:290px}
.plan-link{margin-top:14px;color:var(--inactive);font-size:14px;font-weight:500;padding:8px}
.plan-link b{color:var(--lime);font-weight:600}
.resume{display:flex;align-items:center;gap:14px;background:var(--card);border:1.5px solid rgba(var(--acc-rgb),.35);border-radius:20px;padding:14px;margin-top:14px;width:100%;text-align:left}
.resume .dot{width:44px;height:44px;border-radius:14px;background:var(--lime);display:grid;place-items:center;flex:none}
.resume .t{flex:1;min-width:0}
.resume .t small{display:block;font-size:12px;color:var(--lime);font-weight:700;letter-spacing:.05em;text-transform:uppercase}
.resume .t b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.resume .t span{font-size:13px;color:var(--inactive)}

/* ---------- выбор действия ---------- */
.opt{display:flex;align-items:center;gap:16px;width:100%;padding:18px 4px;border-bottom:1px solid var(--line);text-align:left}
.opt:last-child{border:0}
.opt .ic{width:48px;height:48px;border-radius:16px;background:var(--card2);display:grid;place-items:center;flex:none;color:var(--lime)}
.opt .ic svg{width:24px;height:24px}
.opt b{display:block;font-size:17px;font-weight:600}
.opt span{font-size:13px;color:var(--inactive)}
.dayrow .t .badge,.badge{display:inline-block;width:auto;font-size:11px;font-weight:700;color:var(--on);background:var(--lime);padding:2px 8px;border-radius:99px;margin-left:6px;vertical-align:2px}

/* ---------- выбор мышц ---------- */
.side{display:inline-flex;background:var(--card);border-radius:14px;padding:4px;margin:14px 0 4px}
.side button{height:34px;padding:0 16px;border-radius:11px;font-size:14px;font-weight:600;color:var(--inactive);transition:all .2s}
.side button.on{background:var(--dark);color:var(--text)}
.pickgrid{display:grid;grid-template-columns:136px 1fr;gap:8px;align-items:center;margin-top:8px}
.gcol{display:flex;flex-direction:column;gap:10px}
.gbtn{display:flex;align-items:center;gap:9px;height:46px;padding:0 14px 0 8px;border-radius:99px;border:1.5px solid var(--outline);
  color:var(--inactive);font-weight:600;font-size:15px;transition:all .25s var(--ease)}
.gbtn i{width:26px;height:26px;border-radius:50%;border:1.5px solid var(--outline);display:grid;place-items:center;flex:none;transition:all .25s}
.gbtn i svg{width:13px;height:13px;opacity:0;transition:opacity .2s}
.gbtn.on{border-color:var(--lime);color:var(--text);background:var(--card);box-shadow:0 0 0 1px rgba(var(--acc-rgb),.15),0 0 18px rgba(var(--acc-rgb),.12)}
.gbtn.on i{background:var(--lime);border-color:var(--lime)}
.gbtn.on i svg{opacity:1}
.gbtn:active{transform:scale(.96)}
.pfig{display:flex;justify-content:center}
.pfig svg{height:440px;width:auto;max-width:100%;animation:fade .3s var(--ease)}
.pksum{text-align:center;color:var(--inactive);font-size:14px;margin-top:10px;min-height:20px}
.pksum b{color:var(--text);font-weight:600}

/* ---------- тренировка ---------- */
.wtop{display:flex;align-items:center;gap:12px;margin-bottom:6px}
.wtop .t{flex:1;min-width:0}
.wtop .t b{display:block;font-size:20px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wtop .t span{font-size:13px;color:var(--inactive)}
.clock{font-size:15px;font-weight:700;color:var(--lime);background:var(--card2);padding:10px 12px;border-radius:14px;min-width:68px;text-align:center}
.progress{height:4px;border-radius:2px;background:var(--dark);margin:14px 0 4px;overflow:hidden}
.progress div{height:100%;background:var(--lime);border-radius:2px;transition:width .4s var(--ease)}

.ex{background:var(--card);border-radius:24px;padding:16px;margin-top:12px;transition:background .3s}
.ex.done{background:var(--done)}
.exhead{display:flex;gap:12px;align-items:flex-start}
.exnum{width:30px;height:30px;border-radius:10px;background:var(--dark);display:grid;place-items:center;font-weight:700;font-size:14px;flex:none;transition:all .25s}
.ex.done .exnum{background:var(--lime);color:var(--on)}
.exname{flex:1;min-width:0}
.exname b{display:block;font-size:17px;font-weight:700;line-height:1.25}
.exname span{font-size:13px;color:var(--inactive)}
.exbtns{display:flex;gap:6px}
.exbtns button{width:34px;height:34px;border-radius:11px;background:var(--card2);display:grid;place-items:center;color:var(--inactive)}
.exbtns button:active{color:var(--lime)}
.exbtns svg{width:17px;height:17px}
.favbtn{float:right;display:flex;align-items:center;gap:6px;height:34px;padding:0 12px;border-radius:99px;border:1.5px solid var(--outline);color:var(--inactive);font-size:13px;font-weight:600;margin:4px 0 0 10px}
.favbtn svg{width:16px;height:16px}
.ai{background:var(--card);border:1.5px solid rgba(var(--acc-rgb),.45);border-radius:22px;padding:16px;margin-top:14px;animation:fade .35s var(--ease)}
.ai small{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--lime);font-weight:700;letter-spacing:.05em;text-transform:uppercase}
.ai h3{font-size:19px;font-weight:700;margin:8px 0 4px}
.ai p{font-size:14px;color:var(--inactive);line-height:1.45}
.ai ol{margin:12px 0 0;padding-left:20px;font-size:14px;line-height:1.7}
.ai ol span{color:var(--inactive)}
.ai .cta{margin-top:14px;height:50px}
.mode{display:flex;background:var(--card);border-radius:14px;padding:4px;margin:12px auto 0;max-width:340px}
.mode button{flex:1;height:36px;border-radius:11px;font-size:14px;font-weight:600;color:var(--inactive);transition:all .2s}
.mode button.on{background:var(--dark);color:var(--text)}
.pklist{font-size:13px;color:var(--inactive);text-align:center;margin-top:6px;line-height:1.5}
.target{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0 4px}
.target span{font-size:12px;font-weight:600;color:var(--lime);background:rgba(var(--acc-rgb),.08);border:1px solid rgba(var(--acc-rgb),.22);padding:4px 10px;border-radius:99px}
.tip{display:none;font-size:13px;color:var(--inactive);background:var(--card2);border-radius:14px;padding:10px 12px;margin-top:10px;line-height:1.45}
.tip.open{display:block;animation:fade .25s var(--ease)}

.set{border-top:1px solid var(--line);padding:12px 0 2px;margin-top:10px}
.set:first-of-type{border-top:0}
.setline{display:flex;align-items:center;gap:10px}
.setno{width:22px;font-weight:700;color:var(--mid);font-size:15px}
.set.rated .setno{color:var(--text)}
.val{display:flex;align-items:baseline;gap:4px;background:var(--card2);border-radius:12px;padding:0 10px;height:42px;align-items:center}
.val input{width:58px;background:none;border:0;outline:none;text-align:right;font-size:20px;font-weight:700;padding:0;-moz-appearance:textfield}
.val.reps input{width:36px}
.val input::-webkit-outer-spin-button,.val input::-webkit-inner-spin-button{-webkit-appearance:none}
.val small{font-size:13px;color:var(--inactive);font-weight:600}
.x{color:var(--mid);font-weight:600}
.del{margin-left:auto;width:32px;height:32px;border-radius:10px;display:grid;place-items:center;color:var(--mid)}
.del svg{width:16px;height:16px}
.rates{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-top:10px}
.rates button{height:36px;border-radius:99px;border:1.5px solid var(--outline);color:var(--inactive);font-size:12px;font-weight:700;letter-spacing:.04em;
  transition:transform .15s,background .2s,color .2s,border-color .2s}
.rates button:active{transform:scale(.94)}
.rates [data-r=w].on{background:var(--warm);border-color:var(--warm);color:var(--on)}
.rates [data-r=e]{border-color:rgba(127,183,126,.55)}
.rates [data-r=n]{border-color:rgba(226,176,74,.55)}
.rates [data-r=h]{border-color:rgba(229,83,75,.55)}
.rates [data-r=e].on{background:var(--easy);border-color:var(--easy);color:var(--on)}
.rates [data-r=n].on{background:var(--norm);border-color:var(--norm);color:var(--on)}
.rates [data-r=h].on{background:var(--hard);border-color:var(--hard);color:var(--on)}
.addset{margin-top:12px;width:100%;height:42px;border-radius:14px;border:1.5px dashed var(--dark);color:var(--inactive);font-weight:600;font-size:14px}
.addset:active{border-color:var(--lime);color:var(--lime)}
.addex{margin-top:14px;width:100%;height:54px;border-radius:20px;border:1.5px dashed var(--outline);color:var(--text);font-weight:600;display:flex;align-items:center;justify-content:center;gap:8px}
.finish-fb{display:none}

/* ---------- таймер отдыха ---------- */
.timer{position:fixed;left:12px;right:12px;bottom:calc(var(--bot) + 12px);z-index:30;background:var(--lime);color:var(--on);
  border-radius:24px;padding:14px 16px;display:flex;align-items:center;gap:14px;
  transform:translateY(160%);transition:transform .4s var(--ease)}
.timer.show{transform:none}
.timer .ring{width:52px;height:52px;flex:none;position:relative}
.timer .ring svg{width:52px;height:52px;transform:rotate(-90deg)}
.timer .ring circle{fill:none;stroke-width:5}
.timer .lbl{flex:1}
.timer .lbl small{display:block;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;opacity:.65}
.timer .lbl b{font-size:30px;font-weight:800;letter-spacing:-.02em;line-height:1}
.timer button{height:40px;padding:0 12px;border-radius:13px;background:rgba(0,0,0,.12);font-weight:700;font-size:14px}
.timer.done{animation:pulse .6s ease 3}

/* ---------- каталог ---------- */
.search{display:flex;align-items:center;gap:10px;background:var(--card2);border-radius:16px;padding:0 14px;height:48px}
.search svg{width:18px;height:18px;color:var(--mid);flex:none}
.search input{flex:1;background:none;border:0;outline:none;font-size:16px}
.search input::placeholder{color:var(--mid)}
.gtabs{display:flex;gap:8px;overflow-x:auto;margin:14px -16px 6px;padding:0 16px;scrollbar-width:none}
.gtabs::-webkit-scrollbar{display:none}
.gtabs button{flex:none;height:36px;padding:0 16px;border-radius:99px;border:1.5px solid var(--dark);color:var(--inactive);font-weight:600;font-size:14px;transition:all .2s}
.gtabs button.on{background:var(--lime);border-color:var(--lime);color:var(--on)}
.clist{display:flex;flex-direction:column}
.crow{display:flex;align-items:center;gap:12px;padding:12px 2px;border-bottom:1px solid var(--line);text-align:left;width:100%}
.crow:active{background:var(--card)}
.crow{content-visibility:auto;contain-intrinsic-size:auto 71px}
.crow .mini{width:46px;height:46px;border-radius:14px;background:var(--bg);display:grid;place-items:center;flex:none;overflow:hidden}
.crow .mini svg{width:46px;height:46px}
.crow .t{flex:1;min-width:0}
.crow .t b{display:block;font-weight:600;font-size:15px}
.crow .t span{font-size:12px;color:var(--inactive)}
.crow.cur .t b{color:var(--lime)}
.empty{color:var(--mid);text-align:center;padding:40px 0}

/* ---------- шторка ---------- */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:40;opacity:0;pointer-events:none;transition:opacity .3s}
.scrim.show{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;background:var(--sheet);border-radius:28px 28px 0 0;
  max-height:calc(100% - var(--top) - 40px);display:flex;flex-direction:column;
  transform:translateY(100%);transition:transform .38s var(--ease);border-top:1px solid var(--line)}
.sheet.show{transform:none}
.sheet.full{height:calc(100% - var(--top) - 24px)}
.cedit{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;color:var(--inactive);background:var(--card2);flex:none}
.reorder{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;height:40px;margin:4px 0 10px;color:var(--inactive);font-size:14px;font-weight:600}
.ord{display:flex;flex-direction:column;gap:8px;touch-action:none}
.orow{display:flex;align-items:center;gap:12px;background:var(--card2);border-radius:14px;padding:12px 14px;user-select:none;-webkit-user-select:none;position:relative;transition:transform .15s}
.orow.drag{transition:none;z-index:2;box-shadow:0 8px 24px rgba(0,0,0,.3);background:var(--card)}
.orow .n{width:26px;height:26px;border-radius:8px;background:var(--card);display:grid;place-items:center;font-size:13px;font-weight:700;flex:none}
.orow b{flex:1;font-size:15px;font-weight:600}
.orow .hd{color:var(--mid);padding:6px;margin:-6px;touch-action:none;cursor:grab}
.mkown{display:flex;align-items:center;gap:12px;width:100%;padding:12px 2px;border-bottom:1px solid var(--line);text-align:left}
.mkown .ic{width:46px;height:46px;border-radius:14px;background:rgba(var(--acc-rgb),.14);color:var(--lime);display:grid;place-items:center;font-size:24px;font-weight:600;flex:none}
.mkown b{display:block;font-size:15px}.mkown span{font-size:12.5px;color:var(--inactive)}
.sheet .grip{width:40px;height:5px;border-radius:3px;background:var(--dark);margin:10px auto 4px;flex:none}
.sheet .sh{padding:8px 16px 0;flex:none}
.sheet .sb{overflow-y:auto;padding:0 16px calc(var(--bot) + 24px);flex:1}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--card);border-radius:16px;padding:12px 14px;margin-top:12px;width:100%;text-align:left}
.toggle span{font-size:14px;font-weight:600}
.toggle small{display:block;font-size:12px;color:var(--inactive);font-weight:500}
.sw{width:46px;height:28px;border-radius:99px;background:var(--dark);position:relative;flex:none;transition:background .2s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:var(--inactive);transition:all .2s var(--ease)}
.toggle.on .sw{background:var(--lime)}
.toggle.on .sw::after{left:21px;background:var(--on)}

/* ---------- прогресс ---------- */
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:var(--card);border-radius:20px;padding:16px}
.stat b{display:block;font-size:30px;font-weight:800;letter-spacing:-.02em}
.stat span{font-size:13px;color:var(--inactive)}
.stat.acc{background:var(--lime);color:var(--on)}
.stat.acc span{color:var(--on);opacity:.65}
.plist{background:var(--card);border-radius:20px;overflow:hidden}
.prow{display:flex;justify-content:space-between;gap:12px;padding:13px 16px;border-bottom:1px solid var(--line)}
.prow:last-child{border:0}
.prow span{color:var(--text);font-size:14px}
.prow b{font-weight:700;white-space:nowrap}
.prow b.none{color:var(--mid);font-weight:500}

/* ---------- нижнее меню ---------- */
.nav{position:fixed;left:12px;right:12px;bottom:calc(var(--bot) + 12px);z-index:20;height:64px;border-radius:22px;
  background:var(--navbg);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  display:grid;grid-template-columns:repeat(2,1fr);padding:6px;transition:transform .35s var(--ease)}
.nav.hide{transform:translateY(160%)}
.nav button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;border-radius:16px;color:var(--mid);font-size:11px;font-weight:600}
.nav button svg{width:22px;height:22px}
.nav button.on{color:var(--lime);background:rgba(var(--acc-rgb),.08)}

.toast{position:fixed;left:50%;top:calc(var(--top) + 14px);z-index:60;background:var(--text);color:var(--bg);font-weight:600;font-size:14px;
  padding:10px 16px;border-radius:14px;transform:translate(-50%,-12px);opacity:0;visibility:hidden;pointer-events:none;
  transition:transform .3s var(--ease),opacity .3s,visibility 0s .3s;max-width:90%;text-align:center}
.toast.show{transform:translate(-50%,0);opacity:1;visibility:visible;transition:transform .3s var(--ease),opacity .3s,visibility 0s}

@keyframes fade{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
@keyframes pop{0%{transform:scale(.85)}60%{transform:scale(1.08)}100%{transform:scale(1)}}
@keyframes pulse{50%{transform:scale(1.03)}}
.pop{animation:pop .3s var(--ease)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>

<script>
const D = /*DATA*/{};
const CAT = D.catalog, PLAN = D.plan, GROUPS = D.groups, MUSCLES = D.muscles;
let DAYS = D.days;
const dlabel = (d) => d && d[0] === "W" ? d.slice(1) : d;
const unitOf = (e) => e.kind === "t" ? "сек" : e.kind === "c" ? "мин" : e.kind === "k" ? "ккал" : "повт.";
const tgtText = (e, w, r) => e.kind === "t" ? `${r} сек` : e.kind === "c" ? `${r} мин` : e.kind === "k" ? `${fmt(w) || 0} мин · ${r} ккал` : e.step ? `${fmt(wShow(w))} ${UW()} × ${r}` : `${r} повт.`;
/* ---------- настройки устройства: тема и единицы ---------- */
const SET = Object.assign({ theme: "auto", unit: "kg" }, (() => { try { return JSON.parse(localStorage.getItem("settings")) || {}; } catch (e) { return {}; } })());
const saveSet = () => { try { localStorage.setItem("settings", JSON.stringify(SET)); } catch (e) {} };
const LB = 2.20462;
const UW = () => SET.unit === "lb" ? "lb" : "кг";
const wShow = (kg) => kg === "" || kg == null ? kg : SET.unit === "lb" ? Math.round(Number(kg) * LB * 2) / 2 : kg;
const wIn = (v) => v === "" || v == null ? v : SET.unit === "lb" ? Math.round(Number(v) / LB * 100) / 100 : Number(v);
const REST = 90, REST_WARM = 60;
// отдых подбирается сам: по типу упражнения и цели (тяжёлая база — дольше, изоляция и похудение — короче)
function restFor(id) {
  const e = CAT[id]; if (!e) return REST;
  let t = e.kind !== "w" ? 60 : !e.step ? 75 : e.reps[0] <= 5 ? 180 : e.reps[0] <= 8 ? 120 : 90;
  const g = PROFILE.g || "";
  if (g === "lose") t = Math.max(45, Math.round(t * 0.7 / 15) * 15);
  else if (g === "strength") t += 30;
  else if (g === "health" || g === "fit") t = Math.max(60, Math.round(t * 0.85 / 15) * 15);
  return t;
}
const RATES = [["w","РАЗМ"],["e","ЛЕГК"],["n","НОРМ"],["h","СЛОЖ"]];

/* ---------- Telegram ---------- */
const tg = window.Telegram && window.Telegram.WebApp;
// При запуске с кнопки внизу чата Telegram не передаёт initData — поэтому проверяем платформу
const inTG = !!(tg && tg.platform && tg.platform !== "unknown");
function sendToBot(payload) {
  try { tg.sendData(payload); return true; }
  catch (e) { toast("Открой приложение кнопкой «🏋️ Тренировка» внизу чата"); HN("error"); return false; }
}
const H = (t) => { try { tg.HapticFeedback.impactOccurred(t || "light"); } catch (e) {} };
const HN = (t) => { try { tg.HapticFeedback.notificationOccurred(t || "success"); } catch (e) {} };
if (tg) {
  try { tg.ready(); tg.expand(); } catch (e) {}

  try { tg.disableVerticalSwipes && tg.disableVerticalSwipes(); } catch (e) {}
  try {
    if (inTG && tg.isVersionAtLeast && tg.isVersionAtLeast("8.0") && ["ios","android"].includes(tg.platform)) tg.requestFullscreen();
  } catch (e) {}
}

function applyInsets() {
  if (!tg) return;
  const sa = tg.safeAreaInset || {}, ca = tg.contentSafeAreaInset || {};
  let top = (sa.top || 0) + (ca.top || 0);
  if (tg.isFullscreen && top < 60) top = Math.max(top, 96);
  const bot = (sa.bottom || 0) + (ca.bottom || 0);
  document.documentElement.style.setProperty("--top", top + "px");
  document.documentElement.style.setProperty("--bot", bot + "px");
}
if (tg) {
  applyInsets();
  ["safeAreaChanged", "contentSafeAreaChanged", "fullscreenChanged", "viewportChanged"].forEach(ev => { try { tg.onEvent(ev, applyInsets); } catch (e) {} });
}

/* ---------- данные от бота (в ссылке) ---------- */
function readState() {
  const empty = { n: "A", c: 0, w: {}, s: {}, h: "", f: [], u: {}, a: null };
  try {
    const d = new URLSearchParams(location.search).get("d");
    if (!d) return empty;
    let b = d.replace(/-/g, "+").replace(/_/g, "/");
    while (b.length % 4) b += "=";
    return Object.assign(empty, JSON.parse(atob(b)));
  } catch (e) { return empty; }
}
const S = readState();
Object.assign(CAT, S.cx || {});
const FAV = new Set((store0("fav") || S.f || []).filter(id => CAT[id]));
function store0(k) { try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } }
function toggleFav(id) {
  if (FAV.has(id)) FAV.delete(id); else FAV.add(id);
  try { localStorage.setItem("fav", JSON.stringify([...FAV])); } catch (e) {}
  H("medium"); toast(FAV.has(id) ? "Добавлено в любимые ♥" : "Убрано из любимых");
}
const HEART = (on) => `<svg viewBox="0 0 24 24" style="fill:${on ? "var(--lime)" : "none"};stroke:${on ? "var(--lime)" : "currentColor"}" stroke-width="2.2" stroke-linejoin="round"><path d="M12 20s-7-4.4-9.2-9A5 5 0 0 1 12 6a5 5 0 0 1 9.2 5C19 15.6 12 20 12 20z"/></svg>`;
const hist = {};
function histEntries() {  // каждая тренировка отдельно (в один день их может быть несколько)
  const out = [];
  for (let i = 0; i + 7 <= String(S.h || "").length; i += 7) { const d = S.h.slice(i, i + 6); out.push(["20" + d.slice(0,2) + "-" + d.slice(2,4) + "-" + d.slice(4,6), S.h[i + 6]]); }
  return out;
}
function buildHist() {
  Object.keys(hist).forEach(k => delete hist[k]);
  for (let i = 0; i + 7 <= String(S.h || "").length; i += 7) {
    const d = S.h.slice(i, i + 6); hist["20" + d.slice(0,2) + "-" + d.slice(2,4) + "-" + d.slice(4,6)] = S.h[i + 6];
  }
}
buildHist();

/* ---------- сервер: данные и сохранение прямо из приложения ---------- */
const API = S.x || "";
const AUTH = () => ({ init: (tg && tg.initData) || "", id: S.id || "", k: S.k || "" });
const hasAPI = () => !!(API && ((tg && tg.initData) || (S.id && S.k)));
async function api(path, body, ms) {
  const ctl = new AbortController(), t = setTimeout(() => ctl.abort(), ms || 30000);
  try {
    const r = await fetch(API + "/api/" + path, { method: "POST", headers: { "Content-Type": "text/plain" },
      body: JSON.stringify(Object.assign(AUTH(), body || {})), signal: ctl.signal });
    const d = await r.json();
    if (!r.ok) throw new Error(d.error || r.status);
    return d;
  } finally { clearTimeout(t); }
}
function applyState(st) {
  if (!st || typeof st !== "object") return;
  ["n", "c", "w", "s", "h", "f", "u"].forEach(k => { if (k in st) S[k] = st[k]; });
  if (st.cx) { S.cx = st.cx; Object.assign(CAT, st.cx); }
  S.a = st.a || null; S.nt = st.nt || []; S.pu = st.pu || null; if (st.rl) S.rl = st.rl;
  if (st.id) { S.id = st.id; S.k = st.k; }
  buildHist();
  if (!store0("fav")) { FAV.clear(); (S.f || []).filter(id => CAT[id]).forEach(id => FAV.add(id)); }
  if (st.p) Object.assign(PROFILE, st.p, store0("profile") || {});
  applyTheme(); renderWeek(); renderHome();
  if (current === "prof") renderProfile();
  if (!$("v-onb").classList.contains("hidden") && !onb.edit && hasProfile()) {
    if (PROFILE.g) closeOnb();
    else if (onb.k < ONB_IDX("g")) { onb.k = onb.start = ONB_IDX("g"); renderOnb(); }
  }
}

const store = {
  get(k) { try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} },
  del(k) { try { localStorage.removeItem(k); } catch (e) {} }
};
const fmt = (x) => x == null || x === "" ? "" : String(Math.round(Number(x) * 100) / 100);

function shrink(file, max) {
  return new Promise((ok) => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      const k = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement("canvas"); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(url);
      c.toBlob(b => ok(b || file), "image/jpeg", 0.85);
    };
    img.onerror = () => { URL.revokeObjectURL(url); ok(file); };
    img.src = url;
  });
}

/* ---------- выбор мышц (свои группы для мужского и женского профиля) ---------- */

       core: ["glutes","legs","abs","upper"], order: ["glutes","legs","upper","abs","pilates","cardio","stretch"] },

const GMUS = { chest: ["chest"], back: ["traps","lats","midback","lowerback"], shoulders: ["delts"],

const SPECIAL = { cardio: 1, pilates: 5, stretch: 4 };
const fem = () => PROFILE.s === "f";

const gLabel = (g) => (pg().groups.find(x => x[0] === g) || [g, GROUPS[g] || g])[1];
const defSets = (id) => { const e = CAT[id]; return e.kind === "c" || e.kind === "k" ? 1 : (e.group === "stretch" || e.group === "pilates") ? 2 : 3; };
let pk = { sel: new Set(), mode: "usual" };
function openPick() { pk = { sel: new Set(), mode: "usual" }; renderPick(); go("pick"); }
function renderPick() {

  const core = pg().core, allOn = core.every(g => pk.sel.has(g));
  $("pk-groups").innerHTML = pg().groups.map(([g, t]) => `<button class="gbtn ${(g === "all" ? allOn : pk.sel.has(g)) ? "on" : ""}" data-g="${g}"><i>${ck}</i>${t}</button>`).join("");

  $("pk-mode").querySelectorAll("button").forEach(b => b.onclick = () => { H(); pk.mode = b.dataset.m; renderPick(); });

$("pk-start").onclick = () => {
  if (!pk.sel.size) { toast("Выбери хотя бы одну группу"); HN("error"); return; }
  const groups = pg().order.filter(g => pk.sel.has(g));
  const all = pg().core.every(g => pk.sel.has(g));
  const title = all && groups.length === pg().core.length ? "Всё тело" : groups.map(gLabel).join(" + ");
  const w = { day: "X", title, groups, start: Date.now(), items: pickPlan(groups).map(([id, n]) => freshItem(id, id, 0)) };
  startWorkout(w, true);
};
function hasUsual(groups) {
  const u = S.u || {};
  return groups.length > 0 && groups.every(g => !CATG[g] && u[g] && u[g].length);
}
function pickPlan(groups) {
  groups = pg().order.filter(g => groups.includes(g));
  if (pk.mode === "usual" && hasUsual(groups)) return groups.flatMap(g => S.u[g].filter(([id]) => CAT[id]));
  return buildCustom(groups);
}
function buildCustom(groups) {
  groups = pg().order.filter(g => groups.includes(g));
  if (!groups.length) return [];
  const reg = groups.filter(g => !SPECIAL[g]);
  const total = !reg.length ? 0 : groups.some(g => SPECIAL[g]) ? Math.max(4, reg.length) : Math.min(7, Math.max(5, reg.length));
  const inPlan = new Set(Object.values(PLAN).flatMap(p => p.items.map(x => x[0])));
  const score = (id) => (FAV.has(id) ? -1 : (S.w || {})[id] ? 0 : inPlan.has(id) ? 1 : 2);
  const ranked = (cg) => Object.keys(CAT).map((id, k) => [id, k]).filter(([id]) => CAT[id].group === cg)
    .sort((a, b) => score(a[0]) - score(b[0]) || a[1] - b[1]).map(x => x[0]);
  const out = [];
  let ri = 0;
  groups.forEach(g => {
    const n = SPECIAL[g] || (Math.floor(total / reg.length) + (ri < total % reg.length ? 1 : 0));
    if (!SPECIAL[g]) ri++;
    let ids;
    if (CATG[g]) {  // «верх тела»: по кругу спина → плечи → руки → грудь
      const lists = CATG[g].map(ranked); ids = [];
      for (let k = 0; k < 20; k++) lists.forEach(l => { if (l[k]) ids.push(l[k]); });
    } else ids = ranked(g);
    if (g === "arms") {
      const bi = ids.filter(id => CAT[id].m.includes("biceps") && !CAT[id].m.includes("triceps"));
      const tri = ids.filter(id => !bi.includes(id));
      ids = []; for (let k = 0; k < Math.max(bi.length, tri.length); k++) { if (bi[k]) ids.push(bi[k]); if (tri[k]) ids.push(tri[k]); }
    }
    out.push(...ids.filter(id => !out.includes(id)).slice(0, n));
  });
  return out.map(id => [id, defSets(id)]);
}

    } catch (e) { b.disabled = false; b.textContent = "Не получилось — ещё раз"; HN("error"); }
  };
}

/* ---------- поправить или сбросить рабочий вес ---------- */
function editWeight(id) {
  const e = CAT[id]; if (!e) return;
  H();
  const w = (S.w || {})[id] || [], two = e.kind === "w" || e.kind === "k";
  const u1 = e.kind === "k" ? "мин" : UW(), u2 = unitOf(e).replace(".", "");
  openSheet(`<h2 style="margin:6px 0 4px">${esc(e.name)}</h2><p style="color:var(--inactive);font-size:14px;margin:0">Сейчас: ${w[0] != null ? tgtText(e, w[0], w[1]) : "вес не задан"}</p>`,
    `<div class="wedit">${two ? `<label class="val"><input id="we-w" type="number" inputmode="decimal" step="any" value="${w[0] != null ? fmt(e.kind === "k" ? w[0] : wShow(w[0])) : ""}" placeholder="—"><small>${u1}</small></label><span class="x">${e.kind === "k" ? "·" : "×"}</span>` : ""}
      <label class="val reps"><input id="we-r" type="number" inputmode="numeric" value="${w[1] ?? ""}" placeholder="—"><small>${u2}</small></label></div>
     <button class="cta" id="we-save" style="margin-top:16px">Сохранить</button>
     <button class="wdel" id="we-reset">Сбросить — как будто ещё не делал</button>`);
  const send = async (body, msg) => {
    try { const d = await api("weight", Object.assign({ ex: id }, body)); closeSheet(); applyState(d.state); HN("success"); toast(msg); }
    catch (er) { toast("Не получилось — проверь интернет"); HN("error"); }
  };
  $("we-save").onclick = () => {
    const r = parseInt($("we-r").value, 10), ww = two ? (e.kind === "k" ? Number($("we-w").value) : wIn($("we-w").value)) : 0;
    if (!(r > 0) || (two && e.step && !(ww > 0))) { toast("Заполни значения"); HN("error"); return; }
    send({ w: ww, r }, "Сохранено");
  };
  $("we-reset").onclick = () => send({ reset: 1 }, "Вес сброшен");
}

/* ---------- своё упражнение ---------- */
const METRICS = [["w", "Вес и повторы", "кг × повт"], ["r", "Повторы", "свой вес"], ["t", "Время", "секунды"], ["c", "Время", "минуты"], ["k", "Время и калории", "мин · ккал"]];
function openCreateEx(group, onDone, editId) {
  H();
  if (!hasAPI()) { toast("Добавлять упражнения можно, когда приложение подключено к серверу"); return; }
  const ed = editId ? CAT[editId] : null;
  const nx = ed ? { m: null, g: ed.group, ms: new Set(ed.m || []) } : { m: "w", g: group || "", ms: new Set() };
  openSheet(`<h2 style="margin:6px 0 4px">${ed ? "Изменить упражнение" : "Добавить упражнение"}</h2><p style="color:var(--inactive);font-size:14px;margin:0">${ed ? "Название, раздел и мышцы" : "Появится в каталоге и в тренировках"}</p>`,
    `<input class="cx-in" id="cx-name" maxlength="60" placeholder="Название, например «Падел» или «Шраги»" autocomplete="off" value="${ed ? esc(ed.name) : ""}">
     ${ed ? "" : `<div class="sec">Что записываем</div><div class="cx-opts" id="cx-m"></div>`}
     <div class="sec">Раздел</div><div class="cx-opts" id="cx-g"></div>
     <div class="sec">Какие мышцы работают <span style="text-transform:none;font-weight:500;letter-spacing:0">— можно не выбирать</span></div><div class="cx-opts" id="cx-ms"></div>
     <button class="cta" id="cx-save" style="margin-top:20px">${ed ? "Сохранить" : "Добавить упражнение"}</button>`, true);
  const draw = () => {
    if ($("cx-m")) {
      $("cx-m").innerHTML = METRICS.map(([k, t, sub]) => `<button data-k="${k}" class="${nx.m === k ? "on" : ""}">${t} <small>${sub}</small></button>`).join("");
      $("cx-m").querySelectorAll("button").forEach(b => b.onclick = () => { H(); nx.m = b.dataset.k; draw(); });
    }
    $("cx-g").innerHTML = Object.entries(GROUPS).map(([k, t]) => `<button data-g="${k}" class="${nx.g === k ? "on" : ""}">${t}</button>`).join("");
    $("cx-g").querySelectorAll("button").forEach(b => b.onclick = () => { H(); nx.g = b.dataset.g; draw(); });
    $("cx-ms").innerHTML = Object.entries(MUSCLES).map(([k, t]) => `<button data-m="${k}" class="${nx.ms.has(k) ? "on" : ""}">${t}</button>`).join("");
    $("cx-ms").querySelectorAll("button").forEach(b => b.onclick = () => {
      H(); const k = b.dataset.m;
      if (nx.ms.has(k)) nx.ms.delete(k); else if (nx.ms.size < 4) nx.ms.add(k); else toast("Не больше четырёх мышц");
      draw();
    });
  };
  draw();
  $("cx-save").onclick = async () => {
    const name = $("cx-name").value.trim();
    if (name.length < 2) { toast("Напиши название"); $("cx-name").focus(); HN("error"); return; }
    if (!nx.g) { toast("Выбери раздел"); HN("error"); return; }
    $("cx-save").disabled = true; $("cx-save").textContent = ed ? "Сохраняю…" : "Добавляю…";
    try {
      const body = { name, group: nx.g, muscles: [...nx.ms] };
      const d = ed ? await api("custom/edit", Object.assign({ id: editId }, body)) : await api("custom/add", Object.assign({ metric: nx.m }, body));
      closeSheet(); applyState(d.state);
      HN("success"); toast(ed ? "Сохранено" : `Добавлено в «${GROUPS[nx.g]}»`);
      if (W) renderWorkout();
      if (onDone && d.id) onDone(d.id);
    } catch (e) { $("cx-save").disabled = false; $("cx-save").textContent = ed ? "Сохранить" : "Добавить упражнение"; toast("Не получилось — проверь интернет"); HN("error"); }
  };
}

/* ---------- тренировки за день: просмотр и удаление ---------- */
async function openDay(d) {
  const [y, m, dd] = d.split("-").map(Number);
  const wd = ["воскресенье","понедельник","вторник","среда","четверг","пятница","суббота"][new Date(y, m - 1, dd).getDay()];
  openSheet(`<h2 style="margin:6px 0 2px">${dd} ${MONTHS_G[m - 1]}</h2><p style="color:var(--inactive);font-size:14px;margin:0">${wd}</p>`, THINK("Загружаю…"));
  let res;
  try { res = await api("day", { d }); } catch (e) { $("sh-body").innerHTML = `<p style="color:var(--inactive)">Не загрузилось — проверь интернет</p>`; return; }
  const ss = res.sessions || [];
  if (!ss.length) { $("sh-body").innerHTML = `<p style="color:var(--inactive)">В этот день тренировок нет</p>`; return; }
  const one = (id, w, r) => { const e = CAT[id]; return e.kind === "k" ? `${fmt(w)} мин · ${r} ккал` : e.kind === "w" && w ? `${fmt(wShow(w))} × ${r}` : r + (e.kind === "t" ? " сек" : e.kind === "c" ? " мин" : " повт"); };
  const TRASH = `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 12a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2l1-12M9 7V4h6v3"/></svg>`;
  $("sh-body").innerHTML = ss.map(x => `<div class="dsess" data-sid="${x.sid}">
    <div class="dhead"><h3>${esc(x.day === "X" || !PLAN[x.day] ? x.t : "День " + dlabel(x.day) + " · " + x.t)}${x.imp ? "<span>перенесена</span>" : ""}</h3>
      <button class="dtrash" aria-label="Удалить тренировку">${TRASH}</button></div>
    <div class="dconfirm"><span>Удалить тренировку?</span><button class="dno">Отмена</button><button class="dyes">Удалить</button></div>
    ${x.i.filter(([id]) => CAT[id]).map(([id, xs]) => `<div class="dex"><b>${esc(CAT[id].name)}</b><div class="dsets">${xs.map(([w, r]) => `<span>${one(id, w, r)}</span>`).join("")}</div></div>`).join("")}
  </div>`).join("");
  document.querySelectorAll(".dsess").forEach(card => {
    card.querySelector(".dtrash").onclick = () => { H("medium"); card.classList.add("ask"); };
    card.querySelector(".dno").onclick = () => { H(); card.classList.remove("ask"); };
    card.querySelector(".dyes").onclick = async (ev) => {
      const b = ev.currentTarget; b.disabled = true; b.textContent = "Удаляю…";
      try {
        const r = await api("session/del", { sid: +card.dataset.sid });
        closeSheet(); selDay = null; applyState(r.state); HN("success"); toast("Тренировка удалена");
      } catch (e) { b.disabled = false; b.textContent = "Удалить"; toast("Не получилось — проверь интернет"); HN("error"); }
    };
  });
}

async function noteOp(body) {
  H();
  try { const d = await api("notes", body); S.nt = d.nt || []; if (body.add) toast("Тренер запомнил 👍"); }
  catch (e) { toast("Не получилось — проверь интернет"); }
}

/* ---------- старт ---------- */
renderWeek(); renderHome(); updateMain();
if (!hasProfile()) openOnb(false);
else if (!PROFILE.g) openOnb(false, "g");
else maybeTour();
if (hasAPI()) api("state", {}, 15000).then(applyState).catch(() => {});
</script>
