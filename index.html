<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Тренер</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --lime:#A6FF00; --green:#94E51B; --olive:#669C18;
  --bg:#000000; --graphite:#30363D; --dark:#383838; --mid:#666666;
  --inactive:#A8ABB1; --text:#FFFFFF; --outline:#85858D;
  --card:#121314; --card2:#1B1D20;
  --easy:#94E51B; --norm:#FF9F1C; --hard:#FF4D4D; --warm:#85858D;
  --top:calc(var(--tg-safe-area-inset-top,0px) + var(--tg-content-safe-area-inset-top,0px));
  --bot:calc(var(--tg-safe-area-inset-bottom,0px) + var(--tg-content-safe-area-inset-bottom,0px));
  --ease:cubic-bezier(.2,.8,.2,1);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0}
html,body{background:var(--bg);color:var(--text);height:100%;overflow:hidden;
  font:15px/1.4 Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  -webkit-font-smoothing:antialiased;font-feature-settings:"tnum" 1,"cv11" 1}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;touch-action:manipulation}
input{font:inherit;color:inherit}
svg{display:block}

/* ---------- экраны ---------- */
.view{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;
  padding:calc(var(--top) + 16px) 16px calc(var(--bot) + 110px);
  transition:transform .38s var(--ease),opacity .38s var(--ease)}
.view.off-right{transform:translateX(100%);opacity:.4;pointer-events:none}
.view.off-left{transform:translateX(-22%);opacity:0;pointer-events:none}
.view.hidden{display:none}

/* ---------- шапки ---------- */
.head{display:flex;align-items:flex-end;justify-content:space-between;margin:4px 2px 18px}
.eyebrow{font-size:12px;font-weight:600;color:var(--inactive);letter-spacing:.08em;text-transform:uppercase}
h1{font-size:30px;line-height:1.05;font-weight:800;letter-spacing:-.02em;margin-top:6px}
h2{font-size:20px;font-weight:700;letter-spacing:-.01em}
.sec{font-size:13px;font-weight:600;color:var(--inactive);letter-spacing:.06em;text-transform:uppercase;margin:26px 2px 10px}
.iconbtn{width:42px;height:42px;border-radius:14px;background:var(--card2);display:grid;place-items:center;flex:none}
.iconbtn svg{width:20px;height:20px}

/* ---------- календарь ---------- */
.cal{background:var(--card);border-radius:22px;padding:14px 12px 12px}
.calhead{display:flex;align-items:center;justify-content:space-between;margin:0 4px 12px}
.calhead b{font-size:15px;font-weight:600}
.calhead span{color:var(--inactive);font-size:13px}
.calnav{display:flex;gap:4px}
.calnav button{width:30px;height:30px;border-radius:10px;display:grid;place-items:center;color:var(--inactive)}
.calnav button:active{background:var(--dark)}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.wd{display:flex;flex-direction:column;align-items:center;gap:6px;padding:4px 0}
.wd small{font-size:11px;color:var(--mid);font-weight:600;text-transform:lowercase}
.wd .n{width:38px;height:46px;border-radius:14px;border:1px solid var(--dark);display:grid;place-items:center;
  font-weight:600;font-size:16px;position:relative;transition:all .2s}
.wd.today .n{border-color:var(--lime);color:var(--lime)}
.wd.done .n{background:var(--dark)}
.wd.done .n::after{content:"";position:absolute;bottom:6px;width:5px;height:5px;border-radius:50%;background:var(--lime)}
.wd.future .n{color:var(--mid)}
.wd.sel .n{background:var(--lime);color:#000;border-color:var(--lime)}
.wd.sel .n::after{background:#000}
.calnote{font-size:13px;color:var(--inactive);text-align:center;margin-top:10px;min-height:18px}
.calnote b{color:var(--text);font-weight:600}

/* ---------- карточка «сегодня» ---------- */
.hero{background:var(--card);border-radius:26px;padding:18px;margin-top:14px;position:relative;overflow:hidden}
.hero .tag{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;color:#000;background:var(--lime);
  padding:5px 10px;border-radius:99px;letter-spacing:.02em}
.hero h2{font-size:24px;margin:12px 0 4px}
.hero .meta{color:var(--inactive);font-size:14px}
.bodies{display:flex;justify-content:center;gap:10px;margin:14px 0 4px}
.bodies svg{height:210px;width:auto}
.bodies.sm svg{height:150px}
.fig{display:flex;flex-direction:column;align-items:center;gap:8px}
.fig span{font-size:11px;color:var(--mid);font-weight:600;text-transform:uppercase;letter-spacing:.08em}
.bodies.sm .fig span{display:none}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.chip{display:inline-flex;align-items:center;gap:7px;height:34px;padding:0 14px 0 8px;border-radius:99px;
  border:1.5px solid var(--lime);font-size:13px;font-weight:600}
.chip i{width:18px;height:18px;border-radius:50%;background:var(--lime);display:grid;place-items:center}
.chip i svg{width:11px;height:11px}
.chip.sec2{border-color:var(--olive)}
.chip.sec2 i{background:var(--olive)}
.cta{width:100%;height:56px;border-radius:18px;background:var(--lime);color:#000;font-weight:800;font-size:17px;
  margin-top:18px;display:flex;align-items:center;justify-content:center;gap:10px;transition:transform .15s}
.cta:active{transform:scale(.98)}
.cta.ghost{background:transparent;color:var(--lime);border:1.5px solid var(--lime)}

/* ---------- список дней ---------- */
.daylist{display:flex;flex-direction:column;gap:8px}
.dayrow{display:flex;align-items:center;gap:14px;background:var(--card);border-radius:18px;padding:14px;text-align:left;width:100%}
.dayrow:active{background:var(--card2)}
.dayrow .L{width:44px;height:44px;border-radius:14px;background:var(--dark);display:grid;place-items:center;font-weight:800;font-size:18px;flex:none}
.dayrow.next .L{background:var(--lime);color:#000}
.dayrow .t{flex:1;min-width:0}
.dayrow .t b{display:block;font-weight:600}
.dayrow .t span{font-size:13px;color:var(--inactive);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chev{color:var(--mid);flex:none}

/* ---------- тренировка ---------- */
.wtop{display:flex;align-items:center;gap:12px;margin-bottom:6px}
.wtop .t{flex:1;min-width:0}
.wtop .t b{display:block;font-size:20px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wtop .t span{font-size:13px;color:var(--inactive)}
.clock{font-size:15px;font-weight:700;color:var(--lime);background:var(--card2);padding:10px 12px;border-radius:14px;min-width:68px;text-align:center}
.progress{height:4px;border-radius:2px;background:var(--dark);margin:14px 0 4px;overflow:hidden}
.progress div{height:100%;background:var(--lime);border-radius:2px;transition:width .4s var(--ease)}

.ex{background:var(--card);border-radius:24px;padding:16px;margin-top:12px;transition:background .3s}
.ex.done{background:#0d1406}
.exhead{display:flex;gap:12px;align-items:flex-start}
.exnum{width:30px;height:30px;border-radius:10px;background:var(--dark);display:grid;place-items:center;font-weight:700;font-size:14px;flex:none;transition:all .25s}
.ex.done .exnum{background:var(--lime);color:#000}
.exname{flex:1;min-width:0}
.exname b{display:block;font-size:17px;font-weight:700;line-height:1.25}
.exname span{font-size:13px;color:var(--inactive)}
.exbtns{display:flex;gap:6px}
.exbtns button{width:34px;height:34px;border-radius:11px;background:var(--card2);display:grid;place-items:center;color:var(--inactive)}
.exbtns button:active{color:var(--lime)}
.exbtns svg{width:17px;height:17px}
.target{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0 4px}
.target span{font-size:12px;font-weight:600;color:var(--lime);background:rgba(166,255,0,.08);border:1px solid rgba(166,255,0,.22);padding:4px 10px;border-radius:99px}
.tip{display:none;font-size:13px;color:var(--inactive);background:var(--card2);border-radius:14px;padding:10px 12px;margin-top:10px;line-height:1.45}
.tip.open{display:block;animation:fade .25s var(--ease)}

.set{border-top:1px solid #1f2124;padding:12px 0 2px;margin-top:10px}
.set:first-of-type{border-top:0}
.setline{display:flex;align-items:center;gap:10px}
.setno{width:22px;font-weight:700;color:var(--mid);font-size:15px}
.set.rated .setno{color:var(--text)}
.val{display:flex;align-items:baseline;gap:4px;background:var(--card2);border-radius:12px;padding:0 10px;height:42px;align-items:center}
.val input{width:58px;background:none;border:0;outline:none;text-align:right;font-size:20px;font-weight:700;padding:0;-moz-appearance:textfield}
.val.reps input{width:36px}
.val input::-webkit-outer-spin-button,.val input::-webkit-inner-spin-button{-webkit-appearance:none}
.val small{font-size:13px;color:var(--inactive);font-weight:600}
.x{color:var(--mid);font-weight:600}
.del{margin-left:auto;width:32px;height:32px;border-radius:10px;display:grid;place-items:center;color:var(--mid)}
.del svg{width:16px;height:16px}
.rates{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-top:10px}
.rates button{height:36px;border-radius:99px;border:1.5px solid var(--outline);color:var(--inactive);font-size:12px;font-weight:700;letter-spacing:.04em;
  transition:transform .15s,background .2s,color .2s,border-color .2s}
.rates button:active{transform:scale(.94)}
.rates [data-r=w].on{background:var(--warm);border-color:var(--warm);color:#000}
.rates [data-r=e]{border-color:rgba(148,229,27,.55)}
.rates [data-r=n]{border-color:rgba(255,159,28,.55)}
.rates [data-r=h]{border-color:rgba(255,77,77,.55)}
.rates [data-r=e].on{background:var(--easy);border-color:var(--easy);color:#000}
.rates [data-r=n].on{background:var(--norm);border-color:var(--norm);color:#000}
.rates [data-r=h].on{background:var(--hard);border-color:var(--hard);color:#000}
.addset{margin-top:12px;width:100%;height:42px;border-radius:14px;border:1.5px dashed var(--dark);color:var(--inactive);font-weight:600;font-size:14px}
.addset:active{border-color:var(--lime);color:var(--lime)}
.addex{margin-top:14px;width:100%;height:54px;border-radius:20px;border:1.5px dashed var(--outline);color:var(--text);font-weight:600;display:flex;align-items:center;justify-content:center;gap:8px}
.finish-fb{display:none}

/* ---------- таймер отдыха ---------- */
.timer{position:fixed;left:12px;right:12px;bottom:calc(var(--bot) + 12px);z-index:30;background:var(--lime);color:#000;
  border-radius:24px;padding:14px 16px;display:flex;align-items:center;gap:14px;
  transform:translateY(160%);transition:transform .4s var(--ease)}
.timer.show{transform:none}
.timer .ring{width:52px;height:52px;flex:none;position:relative}
.timer .ring svg{width:52px;height:52px;transform:rotate(-90deg)}
.timer .ring circle{fill:none;stroke-width:5}
.timer .lbl{flex:1}
.timer .lbl small{display:block;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;opacity:.65}
.timer .lbl b{font-size:30px;font-weight:800;letter-spacing:-.02em;line-height:1}
.timer button{height:40px;padding:0 12px;border-radius:13px;background:rgba(0,0,0,.12);font-weight:700;font-size:14px}
.timer.done{animation:pulse .6s ease 3}

/* ---------- каталог ---------- */
.search{display:flex;align-items:center;gap:10px;background:var(--card2);border-radius:16px;padding:0 14px;height:48px}
.search svg{width:18px;height:18px;color:var(--mid);flex:none}
.search input{flex:1;background:none;border:0;outline:none;font-size:16px}
.search input::placeholder{color:var(--mid)}
.gtabs{display:flex;gap:8px;overflow-x:auto;margin:14px -16px 6px;padding:0 16px;scrollbar-width:none}
.gtabs::-webkit-scrollbar{display:none}
.gtabs button{flex:none;height:36px;padding:0 16px;border-radius:99px;border:1.5px solid var(--dark);color:var(--inactive);font-weight:600;font-size:14px;transition:all .2s}
.gtabs button.on{background:var(--lime);border-color:var(--lime);color:#000}
.clist{display:flex;flex-direction:column}
.crow{display:flex;align-items:center;gap:12px;padding:12px 2px;border-bottom:1px solid #17181a;text-align:left;width:100%}
.crow:active{background:var(--card)}
.crow .mini{width:46px;height:46px;border-radius:14px;background:var(--card);display:grid;place-items:center;flex:none;overflow:hidden}
.crow .mini svg{width:46px;height:46px}
.crow .t{flex:1;min-width:0}
.crow .t b{display:block;font-weight:600;font-size:15px}
.crow .t span{font-size:12px;color:var(--inactive)}
.crow.cur .t b{color:var(--lime)}
.empty{color:var(--mid);text-align:center;padding:40px 0}

/* ---------- шторка ---------- */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:40;opacity:0;pointer-events:none;transition:opacity .3s}
.scrim.show{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;background:#0c0d0e;border-radius:28px 28px 0 0;
  max-height:calc(100% - var(--top) - 40px);display:flex;flex-direction:column;
  transform:translateY(100%);transition:transform .38s var(--ease);border-top:1px solid #1d1f22}
.sheet.show{transform:none}
.sheet .grip{width:40px;height:5px;border-radius:3px;background:var(--dark);margin:10px auto 4px;flex:none}
.sheet .sh{padding:8px 16px 0;flex:none}
.sheet .sb{overflow-y:auto;padding:0 16px calc(var(--bot) + 24px);flex:1}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--card);border-radius:16px;padding:12px 14px;margin-top:12px;width:100%;text-align:left}
.toggle span{font-size:14px;font-weight:600}
.toggle small{display:block;font-size:12px;color:var(--inactive);font-weight:500}
.sw{width:46px;height:28px;border-radius:99px;background:var(--dark);position:relative;flex:none;transition:background .2s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:var(--inactive);transition:all .2s var(--ease)}
.toggle.on .sw{background:var(--lime)}
.toggle.on .sw::after{left:21px;background:#000}

/* ---------- прогресс ---------- */
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:var(--card);border-radius:20px;padding:16px}
.stat b{display:block;font-size:30px;font-weight:800;letter-spacing:-.02em}
.stat span{font-size:13px;color:var(--inactive)}
.stat.acc{background:var(--lime);color:#000}
.stat.acc span{color:#000;opacity:.65}
.plist{background:var(--card);border-radius:20px;overflow:hidden}
.prow{display:flex;justify-content:space-between;gap:12px;padding:13px 16px;border-bottom:1px solid #1b1c1f}
.prow:last-child{border:0}
.prow span{color:var(--text);font-size:14px}
.prow b{font-weight:700;white-space:nowrap}
.prow b.none{color:var(--mid);font-weight:500}

/* ---------- нижнее меню ---------- */
.nav{position:fixed;left:12px;right:12px;bottom:calc(var(--bot) + 12px);z-index:20;height:64px;border-radius:22px;
  background:rgba(27,29,32,.92);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  display:grid;grid-template-columns:repeat(3,1fr);padding:6px;transition:transform .35s var(--ease)}
.nav.hide{transform:translateY(160%)}
.nav button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;border-radius:16px;color:var(--mid);font-size:11px;font-weight:600}
.nav button svg{width:22px;height:22px}
.nav button.on{color:var(--lime);background:rgba(166,255,0,.08)}

.toast{position:fixed;left:50%;top:calc(var(--top) + 14px);z-index:60;background:var(--text);color:#000;font-weight:600;font-size:14px;
  padding:10px 16px;border-radius:14px;transform:translate(-50%,-180%);transition:transform .35s var(--ease);max-width:90%;text-align:center}
.toast.show{transform:translate(-50%,0)}

@keyframes fade{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
@keyframes pop{0%{transform:scale(.85)}60%{transform:scale(1.08)}100%{transform:scale(1)}}
@keyframes pulse{50%{transform:scale(1.03)}}
.pop{animation:pop .3s var(--ease)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>

<!-- ============ ДНЕВНИК ============ -->
<section class="view" id="v-home">
  <div class="head">
    <div><div class="eyebrow" id="today-lbl"></div><h1>Дневник</h1></div>
    <div class="iconbtn" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="#A6FF00" stroke-width="2" stroke-linecap="round"><path d="M6.5 6.5v11M17.5 6.5v11M3 9.5v5M21 9.5v5M6.5 12h11"/></svg></div>
  </div>
  <div class="cal">
    <div class="calhead">
      <div><b id="cal-month"></b> <span id="cal-year"></span></div>
      <div class="calnav">
        <button id="cal-prev" aria-label="Прошлая неделя"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M15 6l-6 6 6 6"/></svg></button>
        <button id="cal-next" aria-label="Следующая неделя"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M9 6l6 6-6 6"/></svg></button>
      </div>
    </div>
    <div class="week" id="week"></div>
    <div class="calnote" id="calnote"></div>
  </div>

  <div class="hero" id="hero"></div>

  <div class="sec">Другие тренировки</div>
  <div class="daylist" id="daylist"></div>
</section>

<!-- ============ ТРЕНИРОВКА ============ -->
<section class="view off-right" id="v-work">
  <div class="wtop">
    <button class="iconbtn" id="w-back" aria-label="Назад"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M15 6l-6 6 6 6"/></svg></button>
    <div class="t"><b id="w-title"></b><span id="w-sub"></span></div>
    <div class="clock" id="w-clock">0:00</div>
  </div>
  <div class="bodies sm" id="w-bodies"></div>
  <div class="chips" id="w-chips" style="justify-content:center"></div>
  <div class="progress"><div id="w-prog" style="width:0"></div></div>
  <div id="w-list"></div>
  <button class="addex" id="w-add"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>Добавить упражнение</button>
  <button class="cta finish-fb" id="w-finish">Завершить тренировку</button>
</section>

<!-- ============ КАТАЛОГ ============ -->
<section class="view hidden" id="v-cat">
  <div class="head"><div><div class="eyebrow" id="cat-count"></div><h1>Каталог</h1></div></div>
  <div class="search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg><input id="cat-q" placeholder="Поиск упражнения" autocomplete="off"></div>
  <div class="gtabs" id="cat-tabs"></div>
  <div class="clist" id="cat-list"></div>
</section>

<!-- ============ ПРОГРЕСС ============ -->
<section class="view hidden" id="v-prog"></section>

<!-- ============ нижнее меню ============ -->
<nav class="nav" id="nav">
  <button data-v="home" class="on"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="5" width="16" height="16" rx="3"/><path d="M8 3v4M16 3v4M4 10h16"/></svg>Дневник</button>
  <button data-v="cat"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6.5 6.5v11M17.5 6.5v11M3 9.5v5M21 9.5v5M6.5 12h11"/></svg>Каталог</button>
  <button data-v="prog"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19h16M7 15l4-4 3 3 5-6"/></svg>Прогресс</button>
</nav>

<!-- ============ таймер ============ -->
<div class="timer" id="timer">
  <div class="ring"><svg viewBox="0 0 52 52"><circle cx="26" cy="26" r="22" stroke="rgba(0,0,0,.15)"/><circle id="t-arc" cx="26" cy="26" r="22" stroke="#000" stroke-linecap="round" stroke-dasharray="138.2" stroke-dashoffset="0"/></svg></div>
  <div class="lbl"><small id="t-lbl">Отдых</small><b id="t-val">1:30</b></div>
  <button id="t-plus">+30 с</button>
  <button id="t-stop" aria-label="Пропустить отдых">✕</button>

}

const store = {
  get(k) { try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} },
  del(k) { try { localStorage.removeItem(k); } catch (e) {} }
};
const fmt = (x) => x == null || x === "" ? "" : String(Math.round(Number(x) * 100) / 100);
const esc = (s) => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const $ = (id) => document.getElementById(id);
const plural = (n, a, b, c) => { n = Math.abs(n) % 100; const k = n % 10; return n > 10 && n < 20 ? c : k === 1 ? a : k >= 2 && k <= 4 ? b : c; };

function dayPlan(day) {
  const sw = (S.s || {})[day] || {};
  return PLAN[day].items.map(([id, sets]) => ({ slot: id, id: sw[id] || id, sets }));
}
function musclesOf(ids) {
  const p = new Set(), s = new Set();
  ids.forEach(id => { const e = CAT[id]; if (!e) return; e.m.forEach(m => p.add(m)); e.m2.forEach(m => s.add(m)); });
  p.forEach(m => s.delete(m));
  return [p, s];
}

function pts(a) { return a.map(p => p.join(",")).join(" "); }
function bodySVG(view, prim, sec, opt) {
  const M = view === "front" ? FRONT : BACK;
  const base = "#30363D", off = "#383838";
  let half = "";
  for (const k in BASE) if (BASE[k]) half += `<polygon points="${pts(BASE[k])}" fill="${base}"/>`;
  for (const k in M) {
    const on = prim.has(k), s2 = sec.has(k);
    const fill = on ? "#94E51B" : s2 ? "#669C18" : off;
    const stroke = on ? "#A6FF00" : "#000";
    half += `<polygon points="${pts(M[k])}" fill="${fill}" stroke="${stroke}" stroke-width="${on ? 0.9 : 0.7}" stroke-linejoin="round"/>`;
  }
  let extra = "";
  if (view === "front") {
    const c = prim.has("abs") ? "rgba(0,0,0,.55)" : "rgba(0,0,0,.6)";
    extra = `<path d="M50 57v41M51 67.5h8.6M41 67.5h8.6M51 77.5h8.7M41 77.5h8.7M51 87.5h8.8M41 87.5h8.8" stroke="${c}" stroke-width=".8"/>`;
  }
  const head = `<ellipse cx="50" cy="13.5" rx="8" ry="10" fill="${base}"/>`;
  const glow = prim.size && !(opt && opt.mini) ? `<filter id="g${view}" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="1.6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>` : "";
  const vb = opt && opt.crop === "legs" ? "30 96 40 108" : opt && opt.crop === "upper" ? "24 16 52 82" : "22 0 56 206";
  return `<svg viewBox="${vb}" role="img" aria-label="${view === "front" ? "Вид спереди" : "Вид сзади"}"><defs>${glow}</defs>
    <g ${glow ? `filter="url(#g${view})"` : ""}>${head}<g>${half}</g><g transform="translate(100,0) scale(-1,1)">${half}</g>${extra}</g></svg>`;
}
function bodies(prim, sec) { return `<div class="fig">${bodySVG("front", prim, sec)}<span>спереди</span></div><div class="fig">${bodySVG("back", prim, sec)}<span>сзади</span></div>`; }

/* ---------- календарь ---------- */
const MONTHS = ["январь","февраль","март","апрель","май","июнь","июль","август","сентябрь","октябрь","ноябрь","декабрь"];
const MONTHS_G = ["января","февраля","марта","апреля","мая","июня","июля","августа","сентября","октября","ноября","декабря"];
const WD = ["пн","вт","ср","чт","пт","сб","вс"];
const today = new Date(); today.setHours(0,0,0,0);
const iso = (d) => d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0");
let weekOff = 0, selDay = null;
function renderWeek() {
  const start = new Date(today); start.setDate(today.getDate() - ((today.getDay() + 6) % 7) + weekOff * 7);
  const mid = new Date(start); mid.setDate(start.getDate() + 3);
  $("cal-month").textContent = MONTHS[mid.getMonth()][0].toUpperCase() + MONTHS[mid.getMonth()].slice(1);
  $("cal-year").textContent = mid.getFullYear();
  let html = "";
  for (let i = 0; i < 7; i++) {
    const d = new Date(start); d.setDate(start.getDate() + i);
    const k = iso(d), cls = ["wd"];
    if (k === iso(today)) cls.push("today");
    if (hist[k]) cls.push("done");
    if (d > today) cls.push("future");
    if (k === selDay) cls.push("sel");
    html += `<button class="${cls.join(" ")}" data-d="${k}"><small>${WD[i]}</small><span class="n">${d.getDate()}</span></button>`;
  }
  $("week").innerHTML = html;
  $("week").querySelectorAll(".wd").forEach(b => b.onclick = () => {
    H(); selDay = selDay === b.dataset.d ? null : b.dataset.d; renderWeek();
  });
  const total = Object.keys(hist).length;
  let note = "";
  if (selDay) {
    const [y, m, dd] = selDay.split("-").map(Number);
    const day = hist[selDay];
    note = day ? `${dd} ${MONTHS_G[m-1]}: <b>День ${day} · ${esc(PLAN[day] ? PLAN[day].title : "")}</b>` : `${dd} ${MONTHS_G[m-1]}: тренировки не было`;
  } else {
    note = total ? `За 2 месяца: <b>${total} ${plural(total,"тренировка","тренировки","тренировок")}</b>` : "Отмеченные тренировки появятся здесь";
  }
  $("calnote").innerHTML = note;
}
$("cal-prev").onclick = () => { H(); weekOff--; renderWeek(); };
$("cal-next").onclick = () => { H(); weekOff++; renderWeek(); };
$("today-lbl").textContent = today.getDate() + " " + MONTHS_G[today.getMonth()] + ", " + ["воскресенье","понедельник","вторник","среда","четверг","пятница","суббота"][today.getDay()];

/* ---------- тренировка: состояние ---------- */
let W = null;
const dkey = (day) => "w2_" + day + "_" + S.c;
function freshItem(id, slot, sets) {
  const e = CAT[id], st = (S.w || {})[id];
  const w = st && st[0] != null ? st[0] : (e.step ? "" : 0);
  const r = st ? st[1] : e.reps[0];
  return { id, slot, perm: false, sets: Array.from({ length: sets }, () => ({ w, r, rt: null })), tip: false };
}
function openWorkout(day) {
  H("medium");
  W = store.get(dkey(day));
  if (!W || !W.items) W = { day, start: Date.now(), items: dayPlan(day).map(x => freshItem(x.id, x.slot, x.sets)) };
  save();
  renderWorkout();
  $("v-home").classList.add("off-left");
  $("v-work").classList.remove("off-right");
  $("v-work").scrollTop = 0;
  $("nav").classList.add("hide");
  if (tg && tg.BackButton) { try { tg.BackButton.show(); } catch (e) {} }
  startClock(); updateMain();
}
function closeWorkout() {
  H();
  $("v-home").classList.remove("off-left");
  $("v-work").classList.add("off-right");
  $("nav").classList.remove("hide");
  if (tg && tg.BackButton) { try { tg.BackButton.hide(); } catch (e) {} }
  stopTimer(); W = null; renderHome(); updateMain();
}
$("w-back").onclick = closeWorkout;
if (tg && tg.BackButton) tg.BackButton.onClick(() => { if ($("sheet").classList.contains("show")) closeSheet(); else if (W) closeWorkout(); });
function save() { if (W) store.set(dkey(W.day), W); }

let clockId = null;
function startClock() {
  clearInterval(clockId);
  const tick = () => {
    if (!W) return;
    const s = Math.floor((Date.now() - W.start) / 1000);
    $("w-clock").textContent = s >= 3600 ? Math.floor(s/3600) + ":" + String(Math.floor(s%3600/60)).padStart(2,"0") + ":" + String(s%60).padStart(2,"0")
                                         : Math.floor(s/60) + ":" + String(s%60).padStart(2,"0");
  };
  tick(); clockId = setInterval(tick, 1000);
}

/* ---------- тренировка: отрисовка ---------- */
const IC = {
  info: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 7.5v.5"/></svg>`,
  swap: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 4L3 8l4 4M3 8h14M17 20l4-4-4-4M21 16H7"/></svg>`,
  del: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>`,
  trash: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg>`
};
function renderWorkout() {
  const ids = W.items.map(it => it.id);
  const [p, s] = musclesOf(ids);
  $("w-title").textContent = PLAN[W.day].title;
  $("w-bodies").innerHTML = bodies(p, s);
  $("w-chips").innerHTML = muscleChips(p, new Set());
  $("w-list").innerHTML = W.items.map((it, i) => exCard(it, i)).join("");
  bindCards();

}
function exCard(it, i) {
  const e = CAT[it.id], st = (S.w || {})[it.id];
  const done = it.sets.some(x => x.rt);
  const tgt = st && st[0] != null ? (e.step ? `${fmt(st[0])} кг × ${st[1]}` : `${st[1]} повт.`) : "вес подбирается";
  const swapped = it.slot && it.slot !== it.id;
  return `<div class="ex ${done ? "done" : ""}" data-i="${i}">
    <div class="exhead">
      <div class="exnum">${i + 1}</div>
      <div class="exname"><b>${esc(e.name)}</b><span>${e.m.map(m => MUSCLES[m]).join(" · ")}${swapped ? " · замена" : ""}</span></div>
      <div class="exbtns">
        ${e.tip ? `<button data-act="tip" aria-label="Техника">${IC.info}</button>` : ""}
        ${it.slot ? `<button data-act="swap" aria-label="Заменить">${IC.swap}</button>` : `<button data-act="remove" aria-label="Убрать">${IC.trash}</button>`}
      </div>
    </div>
    <div class="target"><span>Цель: ${it.sets.length} × ${e.reps[0]}–${e.reps[1]}</span><span>${tgt}</span></div>
    <div class="tip ${it.tip ? "open" : ""}">${esc(e.tip || "")}</div>
    ${it.sets.map((x, k) => setRow(e, x, k)).join("")}
    <button class="addset" data-act="addset">+ Подход</button>
  </div>`;
}
function setRow(e, x, k) {
  return `<div class="set ${x.rt ? "rated" : ""}" data-k="${k}">
    <div class="setline">
      <div class="setno">${k + 1}.</div>
      <label class="val"><input type="number" inputmode="decimal" step="any" data-f="w" value="${fmt(x.w)}" placeholder="—"><small>${e.step ? "кг" : "+кг"}</small></label>
      <span class="x">×</span>
      <label class="val reps"><input type="number" inputmode="numeric" data-f="r" value="${x.r ?? ""}" placeholder="—"><small>повт</small></label>
      <button class="del" data-act="delset" aria-label="Удалить подход">${IC.del}</button>
    </div>
    <div class="rates">${RATES.map(([r, t]) => `<button data-r="${r}" class="${x.rt === r ? "on" : ""}">${t}</button>`).join("")}</div>
  </div>`;
}
function bindCards() {
  $("w-list").querySelectorAll(".ex").forEach(card => {
    const i = Number(card.dataset.i), it = W.items[i];
    card.querySelectorAll("[data-act]").forEach(b => b.onclick = () => {
      const a = b.dataset.act;
      if (a === "tip") { it.tip = !it.tip; card.querySelector(".tip").classList.toggle("open", it.tip); H(); save(); }
      if (a === "swap") openPicker("swap", i);
      if (a === "remove") { H("medium"); W.items.splice(i, 1); save(); renderWorkout(); }
      if (a === "addset") {
        H(); const last = it.sets[it.sets.length - 1] || { w: "", r: CAT[it.id].reps[0] };
        it.sets.push({ w: last.w, r: last.r, rt: null }); save(); renderWorkout();
      }
      if (a === "delset") {
        if (it.sets.length <= 1) { toast("Нужен хотя бы один подход"); return; }
        H(); it.sets.splice(Number(b.closest(".set").dataset.k), 1); save(); renderWorkout();
      }
    });
    card.querySelectorAll(".set").forEach(row => {
      const k = Number(row.dataset.k), x = it.sets[k];
      row.querySelectorAll("input").forEach(inp => inp.oninput = () => {
        const v = String(inp.value).replace(",", ".");
        if (inp.dataset.f === "w") x.w = v === "" ? "" : Number(v);
        else x.r = v === "" ? "" : parseInt(v, 10);
        // вес/повторы следующих неотмеченных подходов подтягиваем
        for (let j = k + 1; j < it.sets.length; j++) if (!it.sets[j].rt) it.sets[j][inp.dataset.f] = inp.dataset.f === "w" ? x.w : x.r;
        card.querySelectorAll(".set").forEach((r2, j) => { if (j > k && !it.sets[j].rt) r2.querySelector(`[data-f=${inp.dataset.f}]`).value = inp.dataset.f === "w" ? fmt(x.w) : x.r; });
        save();
      });
      row.querySelectorAll(".rates button").forEach(b => b.onclick = () => {
        const e = CAT[it.id];
        if (e.step && !(Number(x.w) > 0)) { toast("Сначала укажи вес"); HN("error"); row.querySelector("[data-f=w]").focus(); return; }
        if (!(Number(x.r) > 0)) { toast("Укажи повторы"); HN("error"); row.querySelector("[data-f=r]").focus(); return; }
        const was = x.rt;
        x.rt = was === b.dataset.r ? null : b.dataset.r;
        row.querySelectorAll(".rates button").forEach(bb => bb.classList.toggle("on", bb.dataset.r === x.rt));
        row.classList.toggle("rated", !!x.rt);
        card.classList.toggle("done", it.sets.some(s => s.rt));
        if (x.rt) { b.classList.add("pop"); setTimeout(() => b.classList.remove("pop"), 300); H("medium"); }
        if (x.rt && !was) {
          const left = W.items.some(t => t.sets.some(s => !s.rt));
          if (left) startTimer(x.rt === "w" ? REST_WARM : REST);
        }
        save(); updateProgress(); updateMain();
      });
    });
  });
}
$("w-add").onclick = () => openPicker("add");
function updateProgress() {
  const all = W.items.reduce((a, it) => a + it.sets.length, 0);
  const done = W.items.reduce((a, it) => a + it.sets.filter(s => s.rt).length, 0);
  $("w-prog").style.width = (all ? done / all * 100 : 0) + "%";
  $("w-sub").textContent = `День ${W.day} · ${done} из ${all} ${plural(all,"подхода","подходов","подходов")}`;
}

/* ---------- завершение ---------- */
function updateMain() {
  const fb = $("w-finish");
  let text = null;
  if (W) {
    const n = W.items.filter(it => it.sets.some(s => s.rt)).length;
    text = n ? `Завершить · ${n}/${W.items.length}` : null;
  } else if (current === "home") text = null;
  if (inTG && tg.MainButton) {
    try {
      tg.MainButton.setParams({ color: "#A6FF00", text_color: "#000000" });
      if (text) { tg.MainButton.setText(text); tg.MainButton.show(); } else tg.MainButton.hide();
    } catch (e) {}
    fb.style.display = "none";
  } else {
    fb.style.display = text ? "flex" : "none";
    if (text) fb.textContent = text;
  }
}
function finish() {
  if (!W) return;
  const items = W.items.map(it => ({ id: it.id, slot: it.slot || null, perm: it.perm ? 1 : 0,
    sets: it.sets.filter(s => s.rt).map(s => [Number(s.w) || 0, Number(s.r) || 0, s.rt]) })).filter(it => it.sets.length);
  if (!items.length) return;
  const send = () => {
    const payload = JSON.stringify({ day: W.day, items });
    store.del(dkey(W.day));
    HN("success");
    if (inTG) tg.sendData(payload);
    else { toast("Откройте приложение из Telegram"); console.log(payload); }
  };
  const left = W.items.length - items.length;
  if (left && inTG && tg.showConfirm) tg.showConfirm(`Не отмечено упражнений: ${left}. Завершить без них?`, ok => ok && send());
  else send();
}
if (tg && tg.MainButton) tg.MainButton.onClick(finish);
$("w-finish").onclick = finish;

/* ---------- таймер отдыха ---------- */
let tId = null, tEnd = 0, tTotal = REST;
function startTimer(sec) {
  tTotal = sec; tEnd = Date.now() + sec * 1000;
  $("t-lbl").textContent = sec === REST_WARM ? "Отдых после разминки" : "Отдых";
  $("timer").classList.remove("done");
  $("timer").classList.add("show");
  clearInterval(tId); tick(); tId = setInterval(tick, 200);
}
function tick() {
  const left = Math.max(0, Math.ceil((tEnd - Date.now()) / 1000));
  $("t-val").textContent = Math.floor(left / 60) + ":" + String(left % 60).padStart(2, "0");
  $("t-arc").style.strokeDashoffset = 138.2 * (1 - Math.min(1, (tEnd - Date.now()) / 1000 / tTotal));
  if (left <= 0) {
    clearInterval(tId); HN("success");
    $("t-lbl").textContent = "Время подхода"; $("timer").classList.add("done");
    setTimeout(() => { if (Date.now() >= tEnd) $("timer").classList.remove("show"); }, 3000);
  }
}
function stopTimer() { clearInterval(tId); $("timer").classList.remove("show"); }
$("t-plus").onclick = () => { H(); tEnd += 30000; tTotal += 30; if (!$("timer").classList.contains("show") || Date.now() > tEnd - 30000) { $("timer").classList.add("show"); clearInterval(tId); tId = setInterval(tick, 200); } tick(); };
$("t-stop").onclick = () => { H(); stopTimer(); };
document.addEventListener("visibilitychange", () => { if (!document.hidden && $("timer").classList.contains("show")) tick(); });

/* ---------- каталог ---------- */
let catGroup = "all", catQ = "";
function catRows(filter, mark) {
  const q = filter.q.trim().toLowerCase();
  const list = Object.entries(CAT).filter(([id, e]) =>
    (filter.g === "all" || e.group === filter.g) && (!q || e.name.toLowerCase().includes(q)));
  if (!list.length) return `<div class="empty">Ничего не нашлось</div>`;
  return list.map(([id, e]) => {
    const [p, s] = musclesOf([id]);
    return `<button class="crow ${mark === id ? "cur" : ""}" data-id="${id}">
      <div class="mini">${bodySVG(BACK_ONLY.has(e.m[0]) ? "back" : "front", p, s, { mini: 1, crop: e.group === "legs" ? "legs" : "upper" })}</div>
      <div class="t"><b>${esc(e.name)}</b><span>${e.m.concat(e.m2).slice(0, 3).map(m => MUSCLES[m]).join(" · ")}${e.step ? "" : " · свой вес"}</span></div>
      <svg class="chev" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M9 6l6 6-6 6"/></svg></button>`;
  }).join("");
}
const BACK_ONLY = new Set(["lats","midback","lowerback","glutes","hamstrings","triceps","traps"]);
function tabsHTML(g) {
  return [["all","Все"], ...Object.entries(GROUPS)].map(([k, t]) => `<button data-g="${k}" class="${g === k ? "on" : ""}">${t}</button>`).join("");
}
function renderCatalog() {
  $("cat-count").textContent = Object.keys(CAT).length + " упражнений";
  $("cat-tabs").innerHTML = tabsHTML(catGroup);
  $("cat-tabs").querySelectorAll("button").forEach(b => b.onclick = () => { H(); catGroup = b.dataset.g; renderCatalog(); });
  $("cat-list").innerHTML = catRows({ g: catGroup, q: catQ });
  $("cat-list").querySelectorAll(".crow").forEach(b => b.onclick = () => openDetail(b.dataset.id));
}
$("cat-q").oninput = (e) => { catQ = e.target.value; $("cat-list").innerHTML = catRows({ g: catGroup, q: catQ }); $("cat-list").querySelectorAll(".crow").forEach(b => b.onclick = () => openDetail(b.dataset.id)); };

/* ---------- шторка ---------- */
function openSheet(head, body) {
  $("sh-head").innerHTML = head; $("sh-body").innerHTML = body; $("sh-body").scrollTop = 0;
  $("scrim").classList.add("show"); $("sheet").classList.add("show");
  if (tg && tg.BackButton) { try { tg.BackButton.show(); } catch (e) {} }
  try { tg && tg.MainButton && tg.MainButton.hide(); } catch (e) {}
}
function closeSheet() {
  $("scrim").classList.remove("show"); $("sheet").classList.remove("show");
  if (tg && tg.BackButton && !W) { try { tg.BackButton.hide(); } catch (e) {} }
  updateMain();
}
$("scrim").onclick = closeSheet;

function openDetail(id) {
  H();
  const e = CAT[id], [p, s] = musclesOf([id]), st = (S.w || {})[id];
  openSheet(`<h2 style="margin-top:6px">${esc(e.name)}</h2><div style="color:var(--inactive);font-size:14px;margin-top:4px">${GROUPS[e.group]}${e.step ? ` · шаг ${fmt(e.step)} кг` : " · свой вес"} · ${e.reps[0]}–${e.reps[1]} повторов</div>`,
    `<div class="bodies">${bodies(p, s)}</div>
     <div class="chips">${muscleChips(p, s)}</div>
     ${e.tip ? `<div class="sec">Техника</div><div style="font-size:15px;line-height:1.5;color:#d9dadc">${esc(e.tip)}</div>` : ""}
     <div class="sec">Твой рабочий вес</div><div style="font-size:22px;font-weight:700">${st && st[0] != null ? (e.step ? fmt(st[0]) + " кг × " + st[1] : st[1] + " повторов") : '<span style="color:var(--mid);font-weight:500;font-size:15px">Ещё не делал</span>'}</div>`);
}

let pick = null;
function openPicker(mode, i) {
  H();
  const it = mode === "swap" ? W.items[i] : null;
  pick = { mode, i, g: it ? CAT[it.id].group : "all", q: "", perm: false };
  const title = mode === "swap" ? `Замена: ${esc(CAT[it.id].name)}` : "Добавить упражнение";
  openSheet(`<h2 style="margin:6px 0 12px">${title}</h2>
    <div class="search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg><input id="pk-q" placeholder="Поиск" autocomplete="off"></div>
    ${mode === "swap" ? `<button class="toggle" id="pk-perm"><div><span>Заменить навсегда</span><small>В Дне ${W.day} всегда будет новое упражнение</small></div><div class="sw"></div></button>` : ""}
    <div class="gtabs" id="pk-tabs"></div>`, `<div class="clist" id="pk-list"></div>`);
  const draw = () => {
    $("pk-tabs").innerHTML = tabsHTML(pick.g);
    $("pk-tabs").querySelectorAll("button").forEach(b => b.onclick = () => { H(); pick.g = b.dataset.g; draw(); });
    $("pk-list").innerHTML = catRows({ g: pick.g, q: pick.q }, it ? it.id : null);
    $("pk-list").querySelectorAll(".crow").forEach(b => b.onclick = () => choose(b.dataset.id));
  };
  $("pk-q").oninput = (e) => { pick.q = e.target.value; draw(); };
  if ($("pk-perm")) $("pk-perm").onclick = () => { H(); pick.perm = !pick.perm; $("pk-perm").classList.toggle("on", pick.perm); };
  draw();
}
function choose(id) {
  HN("success");
  if (pick.mode === "swap") {
    const old = W.items[pick.i];
    const n = freshItem(id, old.slot, old.sets.length);
    n.perm = pick.perm;
    W.items[pick.i] = n;
    toast(pick.perm ? "Заменено навсегда" : "Заменено на сегодня");
  } else {
    W.items.push(freshItem(id, null, 3));
    toast("Упражнение добавлено");
  }
  save(); closeSheet(); renderWorkout();
  if (pick.mode === "add") setTimeout(() => $("v-work").scrollTo({ top: $("v-work").scrollHeight, behavior: "smooth" }), 80);
}

/* ---------- прогресс ---------- */
function renderProgress() {
  const now = Date.now();
  const last30 = Object.keys(hist).filter(k => (now - new Date(k).getTime()) / 864e5 <= 30).length;
  const known = Object.keys(S.w || {}).filter(k => CAT[k]).length;
  $("v-prog").innerHTML = `
    <div class="head"><div><div class="eyebrow">Твои рабочие веса</div><h1>Прогресс</h1></div></div>
    <div class="stats">
      <div class="stat acc"><b>${S.c}</b><span>${plural(S.c,"тренировка","тренировки","тренировок")} всего</span></div>
      <div class="stat"><b>${last30}</b><span>за 30 дней</span></div>
    </div>` +
    DAYS.map(d => `<div class="sec">День ${d} · ${esc(PLAN[d].title)}</div><div class="plist">` +
      dayPlan(d).map(x => {
        const e = CAT[x.id], w = (S.w || {})[x.id];
        const v = w && w[0] != null ? (e.step ? `${fmt(w[0])} кг × ${w[1]}` : `${w[1]} повт.`) : "";
        return `<div class="prow"><span>${esc(e.name)}</span><b class="${v ? "" : "none"}">${v || "—"}</b></div>`;
      }).join("") + `</div>`).join("") +
    (known ? "" : `<div class="empty" style="padding-top:24px">Закончи первую тренировку — здесь появятся твои веса</div>`);
}

/* ---------- старт ---------- */
renderWeek(); renderHome(); updateMain();
</script>
</body>
</html>
